<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България – Работеща игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjJuReyp2P1EHVmb8i_LXu6AQhvvvByWOCKKl4sVeQTuIKnvmu0dZ64-jCPAw7hisWSrzei_lJeAS3tvQvYHuV5vKWGvc4ZRWsd5XZpgkX-KbUA0o9C2MMXiV1H0NGzVhJEj1iRxeT67HYEAe1VTmjmeI__JKiOCkz6hVVbo6O7gbqfsABylSvdnA-P7VAq/s3072/_d012d68d-c196-4d76-be3e-0a44b9f7ccfa.jpeg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            color: #e0e0e0;
        }
        /* Горна лента */
        #top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: rgba(15,15,15,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid #d4af37;
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .top-bar-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .stat-box {
            font-family: 'Cinzel', serif;
            font-weight: bold;
            color: #ffd700;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        .active-hero-name {
            background: rgba(0,0,0,0.6);
            border-radius: 30px;
            padding: 4px 12px;
            margin-left: 10px;
            font-size: 0.85rem;
            color: #ffd700;
            font-weight: bold;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .top-bar-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .glass-btn {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,215,0,0.5);
            border-radius: 30px;
            padding: 5px 12px;
            font-weight: bold;
            color: #ffdd99;
            cursor: pointer;
            transition: 0.2s;
        }
        .glass-btn:hover {
            background: rgba(255,215,0,0.2);
            transform: scale(1.02);
        }
        /* Главен контейнер – десктоп */
        #game-container {
            display: grid;
            grid-template-columns: 260px 1fr 260px;
            gap: 15px;
            max-width: 1400px;
            margin: 15px auto;
            padding: 0 15px 80px 15px;
        }
        #sidebar-left, #sidebar-right {
            background: rgba(10,10,10,0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(212,175,55,0.3);
        }
        #game-main-area {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px;
        }
        /* Летопис */
        #unifiedChronicle {
            background: transparent;
            margin-bottom: 20px;
        }
        .chronicle-event {
            background: rgba(20,20,40,0.6);
            border-left: 3px solid #d4af37;
            padding: 6px 10px;
            margin-bottom: 6px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
        }
        .chronicle-icon { font-size: 1.3rem; min-width: 32px; text-align: center; }
        .chronicle-text { flex: 1; }
        .chronicle-time { color: #aaa; font-size: 0.65rem; white-space: nowrap; }
        .load-more-btn {
            background: rgba(212,175,55,0.2);
            border: 1px solid #d4af37;
            border-radius: 30px;
            color: #ffd700;
            padding: 4px 12px;
            cursor: pointer;
            margin-top: 8px;
        }
        /* Долна лента */
        #bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-top: 2px solid #d4af37;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 8px;
            z-index: 2000;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: 0.2s;
            color: #ffdd99;
        }
        .icon-btn:hover { transform: scale(1.1); text-shadow: 0 0 8px gold; }
        .next-turn-btn {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            border: 1px solid white;
            color: black;
            font-weight: bold;
            font-size: 1rem;
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        #bottom-controls .hero-profile-btn,
        #bottom-controls button[onclick*="showHeroProfile"],
        .bottom-hero-btn {
            display: none !important;
        }
        /* Модали */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            z-index: 200000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
        }
        .modal-content {
            background: #0a0a1a;
            border: 2px solid #d4af37;
            border-radius: 24px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            padding: 20px;
        }
        /* Мобилен изглед – пренареждане, за да не застъпва */
        @media (max-width: 800px) {
            #game-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            #game-main-area { order: 1; }
            #sidebar-left { order: 2; margin-top: 20px; }
            #sidebar-right { order: 3; }
            .stat-box { font-size: 0.7rem; padding: 2px 8px; }
            .active-hero-name { font-size: 0.7rem; padding: 2px 8px; }
        }
    </style>
</head>
<body>

<header id="top-bar">
    <div class="top-bar-stats">
        <div class="stat-box">⚔️ <span id="val-hero-power">0</span></div>
        <div class="stat-box">💰 <span id="val-gold">0</span></div>
        <div class="stat-box">🏹 <span id="val-army">0</span></div>
        <div class="stat-box">⏳ <span id="current-time-info">пролет, 480 г. пр.н.е.</span></div>
    </div>
    <div class="top-bar-controls">
        <button class="glass-btn" onclick="window.hireNewHero?.()">👑 Наеми</button>
        <button class="glass-btn" onclick="window.toggleGameFullScreen?.()">⬚</button>
        <button class="glass-btn" onclick="window.armyMarket?.show?.()">⚔️ Армия</button>
        <button class="glass-btn" onclick="window.openMarriageMenu?.()">💍 Брак</button>
    </div>
</header>

<main id="game-container">
    <aside id="sidebar-left">
        <div style="text-align: center;">
            <h3 style="color:#ffd700;">Активен Герой</h3>
            <div id="active-character-profile"></div>
        </div>
    </aside>
    <section id="game-main-area">
        <div id="unifiedChronicle">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; padding-bottom: 5px; margin-bottom: 10px;">
                <h3 style="margin:0; color:#d4af37;">📜 Дворцов Летопис</h3>
                <button id="clearChronicleBtn" style="background:rgba(255,80,80,0.2); border:none; border-radius: 20px; padding: 2px 10px; cursor:pointer;">🗑️ Изчисти</button>
            </div>
            <div id="eventsListContainer"></div>
        </div>
        <div style="text-align: center;">
            <h1 style="color:#ffd700;">ВЕЛИКА БЪЛГАРИЯ</h1>
            <p style="color:#ccc;">Води своя род към величие</p>
            <button class="glass-btn" onclick="window.openRegionsMap()">🗺️ Отвори Картата</button>
        </div>
    </section>
    <aside id="sidebar-right">
        <div style="text-align: center;">
            <h3 style="color:#ffd700;">Родови Кланове</h3>
            <div id="clans-container"></div>
        </div>
    </aside>
</main>

<!-- ЛЕНТА С НЕЛЮБИМИТЕ ГЕРОИ – ПРЕМЕСТЕНА НАЙ-ОТДОЛУ (НАД ДОЛНИТЕ БУТОНИ) -->
<div id="top-elite-bar" style="display: flex; gap: 8px; overflow-x: auto; padding: 6px 12px; background: rgba(0,0,0,0.4); border-top: 1px solid #d4af37; margin-top: 0; margin-bottom: 0;"></div>

<div id="bottom-controls">
    <button class="icon-btn" onclick="window.openRegionsMap()" title="Карта">🗺️</button>
    <button class="icon-btn" onclick="window.openBarracksUI?.()" title="Казарми">🏹</button>
    <button class="icon-btn" onclick="window.startBattle('Мизия')" title="Битка">⚔️</button>
    <button class="next-turn-btn" onclick="window.processTurn()">► Ход</button>
    <button class="icon-btn" onclick="window.openEventsMenu?.()" title="Събития">📜</button>
    <button class="icon-btn" onclick="window.openExpeditionsMenu?.()" title="Експедиции">🧭</button>
    <button class="icon-btn" onclick="window.toggleTreasury()" title="Съкровищница">🎒</button>
</div>

<!-- СКРИПТОВЕ -->
<script src="mechanics.js"></script>
<script src="world_data.js"></script>
<script src="database.js"></script>
<script src="rpg_system.js"></script>
<script src="skills.js"></script>
<script src="classes.js"></script>
<script src="time.js"></script>
<script src="economy.js"></script>
<script src="barracks.js"></script>
<script src="regions.js"></script>
<script src="diplomacy.js"></script>
<script src="events.js"></script>
<script src="items.js"></script>
<script src="expeditions.js"></script>
<script src="ui.js"></script>
<script src="battle.js"></script>
<script src="logic.js"></script>
<script src="rivalry.js"></script>
<script src="armyMarket.js"></script>

<!-- ФИНАЛЕН СКРИПТ -->
<script>
(function() {
    // ========== 0. ФИКС ЗА ДУБЛИРАЩИ СЕ НЕЛЮБИМИ ГЕРОИ (rivalry) ==========
    if (window.rivalrySystem && typeof window.rivalrySystem.getEnemyHeroes === 'function') {
        const originalGetEnemy = window.rivalrySystem.getEnemyHeroes;
        window.rivalrySystem.getEnemyHeroes = function() {
            let enemies = originalGetEnemy();
            let unique = [];
            let seen = new Set();
            for (let e of enemies) {
                let id = e.id || e.name || e.clan;
                if (!seen.has(id)) {
                    seen.add(id);
                    unique.push(e);
                }
            }
            return unique;
        };
        console.log("✅ Филтър за дублиращи се врагове активиран.");
    }

    // ========== 1. ПОКАЗВАНЕ НА ИМЕТО НА АКТИВНИЯ ГЕРОЙ В ГОРНАТА ЛЕНТА ==========
    function updateHeroNameInTopBar() {
        let hero = window.currentHero;
        if (!hero) return;
        let heroName = hero.name || "Герой";
        let container = document.querySelector('#top-bar .top-bar-stats');
        if (!container) return;
        let existing = container.querySelector('.active-hero-name');
        if (!existing) {
            let span = document.createElement('span');
            span.className = 'active-hero-name';
            span.innerHTML = `👑 ${heroName}`;
            container.appendChild(span);
        } else {
            existing.innerHTML = `👑 ${heroName}`;
        }
    }
    setInterval(updateHeroNameInTopBar, 1000);
    updateHeroNameInTopBar();

    // ========== 2. АКО НЯМА КАРТА, ПРАВИМ РАБОТЕЩА ==========
    if (typeof window.openRegionsMap !== 'function') {
        window.openRegionsMap = function() {
            const old = document.getElementById('custom-map');
            if (old) old.remove();
            let regions = [];
            if (window.worldData && window.worldData.regions) regions = Object.values(window.worldData.regions);
            else regions = [
                { name: "Мизия", armySize: 150 },
                { name: "Тракия", armySize: 200 },
                { name: "Македония", armySize: 250 }
            ];
            const modal = document.createElement('div');
            modal.id = 'custom-map';
            modal.className = 'modal-overlay';
            let html = '<div class="modal-content"><div style="display:flex; justify-content:space-between;"><h2>🗺️ Региони</h2><button id="closeMapBtn" style="background:red; border:none; color:white; border-radius:50%; width:30px; cursor:pointer;">✕</button></div><div style="display:flex; flex-wrap:wrap;">';
            regions.forEach(r => {
                html += `<div style="border:1px solid gold; margin:8px; padding:8px; border-radius:12px; width:130px; text-align:center;">
                            <div>🏰 ${r.name}</div>
                            <div>⚔️ ${r.armySize}</div>
                            <button class="attackBtn" data-name="${r.name}" style="background:#7a2e1a; border:none; padding:4px 10px; border-radius:20px; margin-top:6px;">⚔️ Атака</button>
                         </div>`;
            });
            html += '</div><div style="text-align:center; margin-top:15px;"><button id="closeMapFooter">Затвори</button></div></div>';
            modal.innerHTML = html;
            document.body.appendChild(modal);
            const close = () => modal.remove();
            modal.querySelector('#closeMapBtn')?.addEventListener('click', close);
            modal.querySelector('#closeMapFooter')?.addEventListener('click', close);
            modal.addEventListener('click', e => { if(e.target === modal) close(); });
            modal.querySelectorAll('.attackBtn').forEach(btn => {
                btn.addEventListener('click', e => {
                    const region = btn.getAttribute('data-name');
                    close();
                    if (typeof window.startBattle === 'function') window.startBattle(region);
                    else console.warn("startBattle липсва");
                });
            });
        };
    }

    // ---------- 3. ГАРАНЦИЯ ЗА БИТКА (ако battle.js не работи) ----------
    if (typeof window.startBattle !== 'function') {
        window.startBattle = function(region) {
            console.log(`Битка в ${region} (симулация)`);
            if (window.currentHero && window.gainHeroXP) {
                let xp = 50 + Math.floor(Math.random() * 80);
                window.gainHeroXP(window.currentHero, xp);
                if (window.addWorldEvent) window.addWorldEvent(`⚔️ Битка в ${region}`, `${window.currentHero.name} победи! +${xp} XP`, "⚔️");
                else alert(`Победа! +${xp} XP`);
            } else alert("Не може да се получи XP");
        };
    }

    // ---------- 4. ЛЕТОПИС И XP ТРЪГВАНЕ ----------
    if (!window.worldEvents) window.worldEvents = [];
    window.addWorldEvent = function(title, desc, icon, year) {
        window.worldEvents.unshift({ id: Date.now(), title, description: desc, icon: icon || '📜', time: year || window.currentYear || "480 г. пр.н.е." });
        if (window.worldEvents.length > 100) window.worldEvents.pop();
        if (typeof window.displayEvents === 'function') window.displayEvents();
        else console.log("Летопис:", title, desc);
    };
    window.displayEvents = function() {
        const cont = document.getElementById('eventsListContainer');
        if (!cont) return;
        const events = window.worldEvents || [];
        if (!events.length) { cont.innerHTML = '<div style="text-align:center; color:#888;">⏳ Няма събития</div>'; return; }
        let html = '';
        events.slice(0, 7).forEach(ev => {
            html += `<div class="chronicle-event"><div class="chronicle-icon">${ev.icon || '📜'}</div><div class="chronicle-text"><strong>${ev.title}</strong> — ${ev.description}</div><div class="chronicle-time">${ev.time}</div></div>`;
        });
        if (events.length > 7) html += `<button class="load-more-btn" onclick="window.displayEventsFull()">📖 Зареди още ${events.length-7}</button>`;
        cont.innerHTML = html;
    };
    window.displayEventsFull = function() {
        const cont = document.getElementById('eventsListContainer');
        if (!cont) return;
        let html = '';
        (window.worldEvents || []).forEach(ev => {
            html += `<div class="chronicle-event"><div class="chronicle-icon">${ev.icon || '📜'}</div><div class="chronicle-text"><strong>${ev.title}</strong> — ${ev.description}</div><div class="chronicle-time">${ev.time}</div></div>`;
        });
        cont.innerHTML = html;
    };

    // ---------- 5. ИНИЦИАЛИЗАЦИЯ НА ГЕРОЙ ----------
    if (!window.currentHero) {
        window.currentHero = {
            name: "Кубрат",
            clan: "Дуло",
            gold: 2000,
            armySize: 500,
            currentArmy: 500,
            heroPower: 150,
            level: 1,
            xp: 0,
            storedXP: 0,
            isAuto: true,
            skillPoints: 0,
            skills: { tactics: 0, endurance: 0, economy: 0, mysticism: 0, leadership: 0 },
            inventory: []
        };
        if (window.initializeHeroRPGData) window.initializeHeroRPGData(window.currentHero);
    } else {
        window.currentHero.isAuto = true;
        if (window.initializeHeroRPGData) window.initializeHeroRPGData(window.currentHero);
    }

// ---------- 6. ОСНОВЕН ХОД НА ИГРАТА (АВТОНОМНИ ГЕРОИ + XP) ----------
const oldProcess = window.processTurn;
window.processTurn = function() {
    // 1. Извикваме оригиналния processTurn (ако съществува)
    if (oldProcess) oldProcess();
    
    // 2. Автономна икономика – дава XP, злато и войски на не-любимите герои
    if (typeof window.calculateEconomy === 'function') {
        window.calculateEconomy();
        console.log("📊 Изпълнена автономна икономика.");
    } else {
        console.warn("⚠️ calculateEconomy не е дефинирана!");
    }
    
    // 3. Автономна дипломация (развитие на купените лидери)
    if (typeof window.processClanDiplomacyAutomation === 'function') {
        window.processClanDiplomacyAutomation();
    }
    
    // 4. Автономни експедиции (портали)
    if (typeof window.advanceExpeditionsTurn === 'function') {
        window.advanceExpeditionsTurn();
    }
    
    // 5. Автоматична атака от съперници (rivalry)
    if (typeof window.checkRandomAttack === 'function') {
        window.checkRandomAttack();
    }
    
    // 6. Допълнителен опит за активния герой (ако искаш да расте по-бързо)
    if (window.currentHero && window.gainHeroXP) {
        window.gainHeroXP(window.currentHero, 15);
        console.log("➕ +15 XP за активния герой от редовен ход");
    }
    
    // 7. Обновяване на интерфейса
    if (window.updateCharacterUI) window.updateCharacterUI(window.currentHero);
    if (window.renderTop6LeadersUI) window.renderTop6LeadersUI();
    if (typeof window.renderSingleBar === 'function') window.renderSingleBar();
};

    // ---------- 7. СЪКРОВИЩНИЦА ----------
    if (typeof window.toggleTreasury !== 'function') {
        window.toggleTreasury = function() {
            const hero = window.currentHero;
            if (!hero) { alert("Няма герой"); return; }
            const inv = hero.inventory || [];
            let html = '<div class="modal-overlay" id="treasuryModal"><div class="modal-content"><h2>🏺 Съкровищница</h2>';
            if (!inv.length) html += '<p>Няма артефакти.</p>';
            else {
                html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px;">';
                inv.forEach(i => {
                    html += `<div style="background:#1a1a2e; border:1px solid gold; border-radius:12px; padding:8px; text-align:center;">
                                <div style="font-size:30px;">${i.icon || '🏺'}</div>
                                <div>${i.name || 'Артефакт'}</div>
                                <div style="font-size:10px;">+${i.bonus?.heroPower || 0} сила</div>
                            </div>`;
                });
                html += '</div>';
            }
            html += `<button id="closeTreasury" style="margin-top:15px; background:#d4af37; border:none; border-radius:20px; padding:6px 12px;">Затвори</button></div></div>`;
            const oldM = document.getElementById('treasuryModal');
            if (oldM) oldM.remove();
            const modal = document.createElement('div');
            modal.innerHTML = html;
            document.body.appendChild(modal);
            modal.querySelector('#closeTreasury').onclick = () => modal.remove();
            modal.onclick = e => { if(e.target === modal) modal.remove(); };
        };
    }

    // ---------- 8. ПЪРВОНАЧАЛНИ СЪБИТИЯ ----------
    if (window.worldEvents.length === 0) {
        window.addWorldEvent("🏛️ Основаване на Тракийското царство", "Тракийските племена се обединяват", "🏰", "480 г. пр.н.е.");
        window.addWorldEvent("⚔️ Подготовка за война", "Персийската империя набира войски", "⚔️", "480 г. пр.н.е.");
    }
    window.displayEvents();

    // ---------- 9. ОПРЕСНЯВАНЕ НА ИНТЕРФЕЙСА ----------
    if (window.updateCharacterUI) window.updateCharacterUI(window.currentHero);
    if (window.renderTop6LeadersUI) window.renderTop6LeadersUI();
    if (window.initHeroBar) window.initHeroBar();
    document.getElementById('clearChronicleBtn')?.addEventListener('click', () => {
        if(confirm("Изчисти летописа?")) { window.worldEvents = []; window.displayEvents(); }
    });
    console.log("✅ Играта е напълно готова – битки, карта, XP, нива, филтрирани врагове, без грозен бутон!");
})();
</script>
</body>
</html>
