<!DOCTYPE html>
<html lang="bg">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>\">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* МОБИЛНА ОПТИМИЗАЦИЯ ЗА БУТОНИТЕ */
        #bottom-controls {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 70px !important;
            background: #111 !important;
            border-top: 2px solid #d4af37 !important;
            display: flex !important;
            justify-content: space-around !important;
            align-items: center !important;
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game-main-area"></div>
    </div>

    <div id="bottom-controls">
        <button class="icon-btn" onclick="window.openRegionsMap()" title="Карта на Родовете">🗺️</button>
        <button class="icon-btn" onclick="window.buyUnits()" title="Военен Стан">🏹</button>
        
        <button class="icon-btn" id="btn-battle" onclick="window.startBattle()" title="Битка">⚔️</button>
        
        <button class="icon-btn" id="btn-expeditions" onclick="window.openExpeditionsMenu()" title="Експедиции">
            🧭
            <div id="expedition-badge" class="mission-badge">0</div>
        </button>
        
        <button class="icon-btn" id="btn-marriage" onclick="window.openMarriageMenu()" title="Уреждане на Брак">👑</button>
        
        <button class="icon-btn" onclick="window.openInventory()" title="Съкровищница">🎒</button>
    </div>

    <div id="battle-screen"></div>

    <script src="mechanics.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="diplomacy.js"></script>
    <script src="regions.js"></script>
    <script src="database.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    
    <script src="expeditions.js"></script>
    
    <script src="rpg_system.js"></script>
    <script src="ui.js"></script>
    <script src="logic.js"></script>

    <script>
        // Стартиране на играта след пълно зареждане на скриптове
        window.addEventListener('DOMContentLoaded', () => {
            if (window.initNewGame) {
                window.initNewGame();
            }
            // Първоначално опресняване на баджа за експедиции
            if (window.updateExpeditionBadge) {
                window.updateExpeditionBadge();
            }
        });
    </script>
</body>
</html>
