<script>
// ==================== ГЛОБАЛНИ ДОПЪЛНЕНИЯ (без currentHero в класически режим) ====================
(function() {
    // Заглушки за липсващи функции (ако не са заредени)
    if (typeof window.renderTop6HeroesUI !== 'function') {
        window.renderTop6HeroesUI = function() {
            console.log("⚠️ renderTop6HeroesUI извикана, но не е дефинирана (заглушка)");
        };
    }
    if (typeof window.createLegendaryHero !== 'function') {
        window.createLegendaryHero = function() {};
    }
    if (typeof window.triggerRandomDuelChallenge !== 'function') {
        window.triggerRandomDuelChallenge = function() {};
    }

    // Коригирана toggleTreasury – работи с избрания герой (getSelectedHero)
    const originalToggle = window.toggleTreasury;
    if (originalToggle) {
        window.toggleTreasury = function() {
            let hero = null;
            if (window.gameMode === 'solo') {
                hero = window.currentHero;
            } else {
                hero = (typeof window.getSelectedHero === 'function') ? window.getSelectedHero() : null;
                if (!hero && typeof window.getStrongestHero === 'function') hero = window.getStrongestHero();
            }
            if (!hero) {
                if (window.showAdvisorPopup) {
                    window.showAdvisorPopup("ВНИМАНИЕ", "Заредете игра или започнете нова, за да отворите съкровищницата.", "warning");
                } else {
                    alert("Съкровищницата не е достъпна. Моля, започнете нова игра.");
                }
                return;
            }
            originalToggle();
        };
    }

    // Функция за показване на модал за избор на режим
    window.showGameModeModal = function() {
        const existingModal = document.getElementById('gameModeModal');
        if (existingModal) existingModal.remove();

        const modal = document.createElement('div');
        modal.id = 'gameModeModal';
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 2147483647;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
        `;
        modal.innerHTML = `
            <div style="background: #0a0a1a; border: 2px solid #d4af37; border-radius: 24px; padding: 20px; max-width: 300px; width: 90%; text-align: center;">
                <h3 style="color: #ffd700; margin-top: 0;">Избор на режим</h3>
                <button class="mode-select-btn" data-mode="classic" style="width: 100%; margin: 8px 0; padding: 10px; background: #2c5a2a; border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer;">🏰 Класически режим</button>
                <button class="mode-select-btn" data-mode="solo" style="width: 100%; margin: 8px 0; padding: 10px; background: #daa520; border: none; border-radius: 30px; color: black; font-weight: bold; cursor: pointer;">⚔️ Соло режим</button>
                <div style="height: 1px; background: #d4af37; margin: 12px 0;"></div>
                <button id="continueGameBtn" style="width: 100%; padding: 10px; background: #2c1a0c; border: 1px solid #d4af37; border-radius: 30px; color: #ffdd99; cursor: pointer;">📜 Продължи текущата игра</button>
                <button id="closeModalBtn" style="width: 100%; margin-top: 12px; padding: 8px; background: none; border: 1px solid #ff6666; border-radius: 30px; color: #ffaaaa; cursor: pointer;">Затвори</button>
            </div>
        `;
        document.body.appendChild(modal);

        function startGame(mode) {
            localStorage.removeItem('GreatBulgaria_SaveGame');
            localStorage.removeItem('favoriteHeroesFinal');
            localStorage.removeItem('heroAutoState');
            localStorage.removeItem('barracksFavorites');
            window.gameMode = mode;
            if (typeof window.startFreshGameLogic === 'function') {
                window.startFreshGameLogic();
            } else {
                location.reload();
            }
        }

        function continueGame() {
            const hasSave = localStorage.getItem('GreatBulgaria_SaveGame');
            if (!hasSave) {
                alert("Няма запазена игра. Започнете нова игра първо.");
                modal.remove();
                return;
            }
            if (typeof window.loadGreatBulgariaGame === 'function') {
                window.loadGreatBulgariaGame();
                modal.remove();
            } else {
                location.reload();
            }
        }

        modal.querySelectorAll('.mode-select-btn').forEach(btn => {
            btn.onclick = () => {
                const mode = btn.getAttribute('data-mode');
                modal.remove();
                startGame(mode);
            };
        });
        const continueBtn = modal.querySelector('#continueGameBtn');
        if (continueBtn) continueBtn.onclick = continueGame;
        const closeBtn = modal.querySelector('#closeModalBtn');
        if (closeBtn) closeBtn.onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    };

    // Ако няма запазена игра, показваме модала след кратко закъснение
    const hasSave = localStorage.getItem('GreatBulgaria_SaveGame');
    if (!hasSave) {
        setTimeout(window.showGameModeModal, 200);
    } else {
        if (typeof window.loadGreatBulgariaGame === 'function') {
            window.loadGreatBulgariaGame();
        }
    }
})();

// Прикачване на бутона "Нова игра" към модала
(function() {
    const newGameBtn = document.getElementById('newGameBtn');
    if (newGameBtn) {
        newGameBtn.onclick = function(e) {
            e.stopPropagation();
            if (typeof window.showGameModeModal === 'function') {
                window.showGameModeModal();
            } else {
                alert("Системата за нова игра не е готова. Моля, презаредете страницата.");
            }
        };
    }
})();
</script>

<script>
(function() {
    // Филтър за дублиращи се врагове (без промяна)
    if (window.rivalrySystem && typeof window.rivalrySystem.getEnemyHeroes === 'function') {
        const originalGetEnemy = window.rivalrySystem.getEnemyHeroes;
        window.rivalrySystem.getEnemyHeroes = function() {
            let enemies = originalGetEnemy();
            let unique = [];
            let seen = new Set();
            for (let e of enemies) {
                let id = e.id || e.name || e.clan;
                if (!seen.has(id)) {
                    seen.add(id);
                    unique.push(e);
                }
            }
            return unique;
        };
        console.log("✅ Филтър за дублиращи се врагове активиран.");
    }

    // Обновяване на името в горната лента – работи с най-силния герой в класически режим
    function updateHeroNameInTopBar() {
        let hero = null;
        if (window.gameMode === 'solo') {
            hero = window.currentHero;
        } else {
            if (typeof window.getStrongestHero === 'function') hero = window.getStrongestHero();
            if (!hero && typeof window.getSelectedHero === 'function') hero = window.getSelectedHero();
        }
        if (!hero) return;
        let heroName = hero.name || "Герой";
        let container = document.querySelector('#top-bar .top-bar-stats');
        if (!container) return;
        let existing = container.querySelector('.active-hero-name');
        if (!existing) {
            let span = document.createElement('span');
            span.className = 'active-hero-name';
            span.innerHTML = `👑 ${heroName}`;
            container.appendChild(span);
        } else {
            existing.innerHTML = `👑 ${heroName}`;
        }
    }
    setInterval(updateHeroNameInTopBar, 1000);
    updateHeroNameInTopBar();

    // Заглушка за openRegionsMap
    if (typeof window.openRegionsMap !== 'function') {
        window.openRegionsMap = function() {};
    }

   

    // Инициализация на летописа (worldEvents)
    if (!window.worldEvents) window.worldEvents = [];
    window.addWorldEvent = function(title, desc, icon, year) {
        window.worldEvents.unshift({ id: Date.now(), title, description: desc, icon: icon || '📜', time: year || window.gameTime?.year ? `${window.gameTime.year} г. ${window.gameTime.era}` : "480 г. пр.н.е." });
        if (window.worldEvents.length > 100) window.worldEvents.pop();
        if (typeof window.displayEvents === 'function') window.displayEvents();
        else console.log("Летопис:", title, desc);
    };
    window.displayEvents = function() {
        const cont = document.getElementById('eventsListContainer');
        if (!cont) return;
        const events = window.worldEvents || [];
        if (!events.length) { cont.innerHTML = '<div style="text-align:center; color:#888;">⏳ Няма събития</div>'; return; }
        let html = '';
        events.slice(0, 7).forEach(ev => {
            html += `<div class="chronicle-event"><div class="chronicle-icon">${ev.icon || '📜'}</div><div class="chronicle-text"><strong>${ev.title}</strong> — ${ev.description}</div><div class="chronicle-time">${ev.time}</div></div>`;
        });
        if (events.length > 7) html += `<button class="load-more-btn" onclick="window.displayEventsFull()">📖 Зареди още ${events.length-7}</button>`;
        cont.innerHTML = html;
    };
    window.displayEventsFull = function() {
        const cont = document.getElementById('eventsListContainer');
        if (!cont) return;
        let html = '';
        (window.worldEvents || []).forEach(ev => {
            html += `<div class="chronicle-event"><div class="chronicle-icon">${ev.icon || '📜'}</div><div class="chronicle-text"><strong>${ev.title}</strong> — ${ev.description}</div><div class="chronicle-time">${ev.time}</div></div>`;
        });
        cont.innerHTML = html;
    };

    // Премахваме създаването на фалшив window.currentHero – в класически режим той не трябва да съществува.
    // Вместо това, ако няма герой, разчитаме на getStrongestHero / getSelectedHero.

    window.updateTimeUI = function() {
        const timeSpan = document.getElementById('current-time-info');
        if (!timeSpan || !window.gameTime) return;
        const seasons = ["🌱 Пролет", "☀️ Лято", "🍂 Есен", "❄️ Зима"];
        const currentSeason = seasons[window.gameTime.seasonIndex] || "Сезон";
        timeSpan.innerHTML = `${currentSeason} ${window.gameTime.year} г. ${window.gameTime.era}`;
    };
    
    window.updateTimeUI();
    
    window.processTurn = function() {
        if (window.tournament) {
    if (window.tournament.isActive && window.tournament.isActive()) {
        window.tournament.advance();
    } else {
        window.tournament.checkAutoStart();
    }
}
        if (typeof window.processAncientCivilizations === 'function') window.processAncientCivilizations();
        if (!window.gameTime) {
            window.gameTime = { seasonIndex: 0, year: 480, era: "пр.н.е." };
        }
        window.gameTime.seasonIndex++;
        if (window.gameTime.seasonIndex > 3) {
            window.gameTime.seasonIndex = 0;
            if (window.gameTime.era === "пр.н.е." && window.gameTime.year > 0) {
                window.gameTime.year--;
                if (window.gameTime.year === 0) {
                    window.gameTime.year = 1;
                    window.gameTime.era = "от н.е.";
                }
            } else {
                window.gameTime.year++;
            }
        }
        window.updateTimeUI();
        
        if (typeof window.calculateEconomy === 'function') window.calculateEconomy();
        if (typeof window.processClanDiplomacyAutomation === 'function') window.processClanDiplomacyAutomation();
        if (typeof window.advanceExpeditionsTurn === 'function') window.advanceExpeditionsTurn();
        if (typeof window.autonomousRegionConquest === 'function') window.autonomousRegionConquest();

        // Обновяване на героите (без currentHero)
        if (window.worldData && window.worldData.clans) {
            for (let key in window.worldData.clans) {
                let hero = window.worldData.clans[key];
                if (hero.isJoined === true && hero.isAlive !== false) {
                    if (typeof window.evolveHero === 'function') window.evolveHero(hero);
                    if (typeof window.automateHero === 'function') window.automateHero(hero);
                    if (hero.hp < hero.maxHp) {
                        let regen = Math.max(1, Math.floor(hero.maxHp * 0.05));
                        let endurance = hero.skills?.endurance || 0;
                        regen += endurance;
                        hero.hp = Math.min(hero.maxHp, hero.hp + regen);
                    }
                }
            }
        }
        if (typeof window.checkRandomAttack === 'function') window.checkRandomAttack();
        
        // В класически режим даваме XP на най-силния герой (или на всички живи?)
        // За простота – на най-силния
        let mainHero = null;
        if (window.gameMode === 'solo') {
            mainHero = window.currentHero;
        } else {
            if (typeof window.getStrongestHero === 'function') mainHero = window.getStrongestHero();
        }
        if (mainHero && window.gainHeroXP) window.gainHeroXP(mainHero, 15);
        
        if (Math.random() < 0.02 && typeof window.createLegendaryHero === 'function') window.createLegendaryHero();
        if (Math.random() < 0.15 && typeof window.triggerRandomDuelChallenge === 'function') window.triggerRandomDuelChallenge();
        
        // Обновяване на UI с най-силния герой (ляв панел)
        if (typeof window.updateStrongestHeroUI === 'function') {
            window.updateStrongestHeroUI();
        }
        // За съвместимост със стари функции
        if (window.renderTop6HeroesUI) window.renderTop6HeroesUI();
        if (typeof window.renderSingleBar === 'function') window.renderSingleBar();
        if (typeof window.saveGreatBulgariaGame === 'function') window.saveGreatBulgariaGame();
    };

    if (typeof window.toggleTreasury !== 'function') {
        window.toggleTreasury = function() {
            let hero = null;
            if (window.gameMode === 'solo') hero = window.currentHero;
            else if (typeof window.getSelectedHero === 'function') hero = window.getSelectedHero();
            else if (typeof window.getStrongestHero === 'function') hero = window.getStrongestHero();
            if (!hero) { alert("Няма герой"); return; }
            const inv = hero.inventory || [];
            let html = '<div class="modal-overlay" id="treasuryModal"><div class="modal-content"><h2>🏺 Съкровищница</h2>';
            if (!inv.length) html += '<p>Няма артефакти.</p>';
            else {
                html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px;">';
                inv.forEach(i => {
                    html += `<div style="background:#1a1a2e; border:1px solid gold; border-radius:12px; padding:8px; text-align:center;">
                                <div style="font-size:30px;">${i.icon || '🏺'}</div>
                                <div>${i.name || 'Артефакт'}</div>
                                <div style="font-size:10px;">+${i.bonus?.heroPower || 0} сила</div>
                            </div>`;
                });
                html += '</div>';
            }
            html += `<button id="closeTreasury" style="margin-top:15px; background:#d4af37; border:none; border-radius:20px; padding:6px 12px;">Затвори</button></div></div>`;
            const oldM = document.getElementById('treasuryModal');
            if (oldM) oldM.remove();
            const modal = document.createElement('div');
            modal.innerHTML = html;
            document.body.appendChild(modal);
            modal.querySelector('#closeTreasury').onclick = () => modal.remove();
            modal.onclick = e => { if(e.target === modal) modal.remove(); };
        };
    }

    // Добавяне на няколко примерни събития в летописа, ако е празен
    if (window.worldEvents.length === 0) {
        window.addWorldEvent("🏛️ Основаване на Тракийското царство", "Тракийските племена се обединяват", "🏰", "480 г. пр.н.е.");
        window.addWorldEvent("⚔️ Подготовка за война", "Персийската империя набира войски", "⚔️", "480 г. пр.н.е.");
    }
    window.displayEvents();

    // Обновяване на UI с най-силния герой при старт
    if (typeof window.updateStrongestHeroUI === 'function') {
        window.updateStrongestHeroUI();
    }
    if (window.addWorldEvent) window.addWorldEvent("⚙️ ХОД", "Светът се променя...", "🌍");
    if (window.renderTop6HeroesUI) window.renderTop6HeroesUI();
    if (window.initHeroBar) window.initHeroBar();
    document.getElementById('clearChronicleBtn')?.addEventListener('click', () => {
        if(confirm("Изчисти летописа?")) { window.worldEvents = []; window.displayEvents(); }
    });
    
    console.log("✅ Играта е напълно готова (без currentHero в класически режим)!");
})();
</script>

    <script>
(function() {
    // ==================== Lazy loading на skills.js ====================
    let skillsLoaded = false;
    let skillsLoading = null;
    window.loadSkills = function() {
        if (skillsLoaded) return Promise.resolve();
        if (skillsLoading) return skillsLoading;
        skillsLoading = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'skills.js';
            script.onload = () => {
                skillsLoaded = true;
                console.log("✅ skills.js зареден lazy");
                resolve();
            };
            script.onerror = () => reject(new Error("Грешка при зареждане на skills.js"));
            document.head.appendChild(script);
        });
        return skillsLoading;
    };

    // Прокси за window.advancedSkills
    let _advancedSkills = null;
    Object.defineProperty(window, 'advancedSkills', {
        get: function() {
            if (!skillsLoaded) {
                console.warn("⚠️ advancedSkills не е зареден, опит за динамично зареждане...");
                // Това е синхронен опит, няма да работи добре. По-добре да използваме асинхронен подход.
                // Затова ще оставим това като предупреждение.
                return null;
            }
            return _advancedSkills;
        },
        set: function(val) { _advancedSkills = val; },
        configurable: true
    });
    // По-добре: презаписваме функциите, които използват advancedSkills
    const originalOpenSkillsUI = window.openSkillsUI;
    if (originalOpenSkillsUI) {
        window.openSkillsUI = async function(...args) {
            await window.loadSkills();
            return originalOpenSkillsUI(...args);
        };
    }
    // Също и за getAdvancedSkillBonuses, learnAdvancedSkill и др.
    const originalGetAdvancedSkillBonuses = window.getAdvancedSkillBonuses;
    if (originalGetAdvancedSkillBonuses) {
        window.getAdvancedSkillBonuses = async function(...args) {
            await window.loadSkills();
            return originalGetAdvancedSkillBonuses(...args);
        };
    }
    const originalLearnAdvancedSkill = window.learnAdvancedSkill;
    if (originalLearnAdvancedSkill) {
        window.learnAdvancedSkill = async function(...args) {
            await window.loadSkills();
            return originalLearnAdvancedSkill(...args);
        };
    }
    const originalGetAllAdvancedSkills = window.getAllAdvancedSkills;
    if (originalGetAllAdvancedSkills) {
        window.getAllAdvancedSkills = async function(...args) {
            await window.loadSkills();
            return originalGetAllAdvancedSkills(...args);
        };
    }

    // ==================== Lazy loading на items.js ====================
    let itemsLoaded = false;
    let itemsLoading = null;
    window.loadItems = function() {
        if (itemsLoaded) return Promise.resolve();
        if (itemsLoading) return itemsLoading;
        itemsLoading = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'items.js';
            script.onload = () => {
                itemsLoaded = true;
                console.log("✅ items.js зареден lazy");
                resolve();
            };
            script.onerror = () => reject(new Error("Грешка при зареждане на items.js"));
            document.head.appendChild(script);
        });
        return itemsLoading;
    };

    // Прокси за функции, които разчитат на items.js
    const originalToggleTreasury = window.toggleTreasury;
    if (originalToggleTreasury) {
        window.toggleTreasury = async function(...args) {
            await window.loadItems();
            return originalToggleTreasury(...args);
        };
    }
    const originalAutoEquipHero = window.autoEquipHero;
    if (originalAutoEquipHero) {
        window.autoEquipHero = async function(...args) {
            await window.loadItems();
            return originalAutoEquipHero(...args);
        };
    }
    const originalGetInventoryBonuses = window.getInventoryBonuses;
    if (originalGetInventoryBonuses) {
        window.getInventoryBonuses = async function(...args) {
            await window.loadItems();
            return originalGetInventoryBonuses(...args);
        };
    }
    const originalCheckSetCompletion = window.checkSetCompletion;
    if (originalCheckSetCompletion) {
        window.checkSetCompletion = async function(...args) {
            await window.loadItems();
            return originalCheckSetCompletion(...args);
        };
    }

    // ==================== Lazy loading на chronicle_events.js ====================
    let chronicleEventsLoaded = false;
    let chronicleEventsLoading = null;
    window.loadChronicleEvents = function() {
        if (chronicleEventsLoaded) return Promise.resolve();
        if (chronicleEventsLoading) return chronicleEventsLoading;
        chronicleEventsLoading = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'chronicle_events.js';
            script.onload = () => {
                chronicleEventsLoaded = true;
                console.log("✅ chronicle_events.js зареден lazy");
                resolve();
            };
            script.onerror = () => reject(new Error("Грешка при зареждане на chronicle_events.js"));
            document.head.appendChild(script);
        });
        return chronicleEventsLoading;
    };

    // Прокси за triggerRandomChronicleEvent
    const originalTrigger = window.triggerRandomChronicleEvent;
    if (originalTrigger) {
        window.triggerRandomChronicleEvent = async function(...args) {
            await window.loadChronicleEvents();
            return originalTrigger(...args);
        };
    }
    // За window.ChronicleEvents – обектът се създава от chronicle_events.js, не може да се проксира лесно.
    // Но можем да заредим скрипта при първи достъп до ChronicleEvents.
    let _ChronicleEvents = null;
    Object.defineProperty(window, 'ChronicleEvents', {
        get: function() {
            if (!chronicleEventsLoaded) {
                console.warn("⚠️ ChronicleEvents не е зареден, опит за динамично зареждане...");
                // Асинхронно зареждане – тук няма как да върнем Promise.
                // Затова по-добре да заредим при нужда синхронно? Не може.
                // Вместо това, презаписваме функциите, които използват ChronicleEvents.
                window.loadChronicleEvents().catch(console.error);
                return null;
            }
            return _ChronicleEvents;
        },
        set: function(val) { _ChronicleEvents = val; },
        configurable: true
    });

    // Презаписваме функции, които разчитат на ChronicleEvents.generate...
    const originalGenerateEconomicEvent = window.ChronicleEvents?.generateEconomicEvent;
    if (originalGenerateEconomicEvent) {
        window.generateEconomicEvent = async function(...args) {
            await window.loadChronicleEvents();
            return window.ChronicleEvents.generateEconomicEvent(...args);
        };
    }
    // ... аналогично за другите генератори (но те са рядко използвани, ще се заредят при нужда).
})();
</script>
