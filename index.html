<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .top-btn { background: #1a1a1a; color: #d4af37; border: 1px solid #333; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 18px; transition: 0.3s; }
        .top-btn:hover { background: #d4af37; color: black; border-color: #d4af37; }
        .next-turn-btn { background: #d4af37; color: black; font-weight: bold; }
    </style>
</head>
<body style="background-color: #050505; color: #eee; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden;">

    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        
        <!-- ВРЕМЕ -->
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37; min-width: 180px;">
            <div id="current-time-info" style="font-size: 14px;">🌱 Пролет, 480 пр.н.е.</div>
            <div style="font-size: 9px; letter-spacing: 1px; opacity: 0.7;">АНТИЧНОСТ</div>
        </div>
        
        <!-- КОМАНДНИ ИКОНИ -->
        <div id="main-controls" style="display: flex; gap: 8px; align-items: center;">
            <button class="top-btn next-turn-btn" onclick="window.advanceTurn()" title="Следващ ход (⏳)">⏳</button>
            <button class="top-btn" onclick="window.startBattle()" title="Битка (⚔️)">⚔️</button>
            <button class="top-btn" onclick="window.openMarriageMenu()" title="Династичен брак (💍)">💍</button>
        </div>

        <!-- РЕСУРСИ -->
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="display: flex; gap: 15px; font-size: 14px; font-family: 'Cinzel', serif;">
                <div title="Злато">💰 <span id="gold-amount" style="color: #ffd700;">750</span></div>
                <div title="Армия">🛡️ <span id="army-total" style="color: #ff4d4d;">100</span></div>
            </div>
            
            <div style="display: flex; gap: 8px; border-left: 1px solid #333; padding-left: 15px;">
                <button class="top-btn" style="padding: 5px 10px; font-size: 14px;" onclick="window.toggleFullScreen()">⛶</button>
                <button onclick="window.setLanguage('BG')" style="background:none; border:none; cursor:pointer; font-size: 20px;">🇧🇬</button>
            </div>
        </div>
    </header>

    <main id="game-container" style="display: flex; height: calc(100vh - 60px);">
        <aside id="left-sidebar" style="width: 250px; background: #0a0a0a; border-right: 1px solid #333; padding: 15px; overflow-y: auto;">
            <h3 style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 15px;">ВЛАДЕНИЯ</h3>
            <div id="provinces-list"></div>
        </aside>

        <section id="game-main-area" style="flex: 1; padding: 20px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); overflow-y: auto;">
            <div id="events-center"></div>
        </section>

        <aside id="right-sidebar" style="width: 320px; background: #0a0a0a; border-left: 1px solid #333; padding: 15px; overflow-y: auto;">
            <div id="character-panel"></div>
        </aside>
    </main>

    <!-- СКРИПТОВЕ -->
    <script src="database.js"></script>
    <script src="mechanics.js"></script>
    <script src="time.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
</body>
</html>
