<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="battle-screen"></div>

    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37;">
            <div id="current-time-info" style="font-size: 13px;">🌱 Пролет, 632 от н.е.</div>
            <div style="font-size: 9px; opacity: 0.6;">СРЕДНОВЕКОВИЕ</div>
        </div>
        
        <div id="main-controls" class="controls" style="display: flex; gap: 5px;">
            <button class="top-btn" onclick="window.advanceTurn()" title="Следващ ход">⏳</button>
            <button class="top-btn" onclick="window.startBattle()" title="Битка">⚔️</button>
            <button class="top-btn" onclick="window.openMarriageMenu()" title="Брак">💍</button>
            <button class="top-btn" onclick="window.toggleFullScreen()">⛶</button>
        </div>

        <div style="font-family: 'Cinzel', serif; font-size: 14px; color: #ffd700;">
            💰 <span id="gold-amount">1500</span>
        </div>
    </header>

    <div id="marquee-container" style="background: #000; border-bottom: 1px solid #d4af37; height: 25px; overflow: hidden; display: flex; align-items: center;">
    <div id="marquee-text" class="marquee-style">Зареждане на предложенията от старейшините...</div>
</div>

<script src="suggestions.js"></script>

    <div id="action-bar" style="background: #0a0a0a; border-bottom: 1px solid #333; display: flex; justify-content: space-around; align-items: center; height: 50px;">
        <button onclick="window.buyUnits()" style="background:none; border:none; color:#d4af37; font-family:'Cinzel'; font-size:11px; cursor:pointer;">🛡️ ОБУЧЕНИЕ</button>
        
        <div style="display: flex; gap: 15px; font-size: 12px; font-family: 'Cinzel';">
            <span>⚔️ <span id="hero-power-val" style="color:#ff4d4d;">150</span></span>
            <span>🛡️ <span id="army-val">500</span></span>
        </div>

        <div style="position: relative; cursor: pointer;" onclick="window.toggleTreasury()">
            <span style="font-size: 20px;">🏺</span>
            <div id="new-item-badge" style="display: none; position: absolute; top: -5px; right: -8px; background: #ff4d4d; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; border: 1px solid white;">0</div>
        </div>
    </div>

    <main id="game-container">
        <aside id="left-sidebar">
            <div id="provinces-list"></div>

            <div id="suggestion-input-block" style="margin-top: 20px; padding: 10px; border-top: 1px dashed #333;">
    <div style="font-size: 9px; color: #d4af37; font-family: 'Cinzel'; margin-bottom: 5px;">ПРЕДЛОЖЕНИЕ ДО КАНА:</div>
    <textarea id="player-suggestion-text" placeholder="Напиши своята мъдрост тук..." 
        style="width: 100%; height: 50px; background: #000; border: 1px solid #222; color: #eee; font-size: 10px; padding: 5px; box-sizing: border-box; resize: none;"></textarea>
    <button onclick="window.submitSuggestion()" 
        style="width: 100%; margin-top: 5px; background: #111; border: 1px solid #d4af37; color: #d4af37; font-family: 'Cinzel'; font-size: 9px; cursor: pointer; padding: 5px;">
        ИЗПРАТИ В КНИГАТА
    </button>
</div>
        </aside>

        <section id="game-main-area">
            <div id="central-display" style="height: 100%; display: flex; justify-content: center; align-items: center; opacity: 0.1;">
                 <img src="assets/icons/clans/default.png" style="width: 300px; filter: grayscale(1);" onerror="this.style.display='none'">
            </div>
            
            <div id="treasury-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; padding: 20px; border: 1px solid #d4af37; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px;">
                    <h2 style="font-family: 'Cinzel'; color: #d4af37; font-size: 18px; margin:0;">🏺 СЪКРОВИЩНИЦА</h2>
                    <button onclick="window.toggleTreasury()" style="background:none; border:none; color:#d4af37; font-size:24px;">✕</button>
                </div>
                <div id="treasury-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin-top: 20px;"></div>
            </div>
        </section>

        <aside id="right-sidebar" style="width: 280px; background: #0a0a0a; border-left: 1px solid #333; overflow-y: hidden;">
            <div id="events-center"></div>
        </aside>
    </main>

    <script src="database.js"></script>
    <script src="mechanics.js"></script>
    <script src="time.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
</body>
</html>
