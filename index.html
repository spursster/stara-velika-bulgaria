<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="battle-screen"></div>
    <div id="event-modal" style="display: none;"></div>

    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37;">
            <div id="current-time-info" style="font-size: 13px;">Зареждане...</div>
            <div id="era-display" style="font-size: 9px; opacity: 0.6; letter-spacing: 1px;">АНТИЧНОСТ</div>
        </div>
        <div style="font-family: 'Cinzel', serif; font-size: 14px; color: #ffd700;">💰 <span id="stat-gold">1500</span></div>
    </header>

    <main id="game-container">
        <aside id="left-sidebar">
            <div id="provinces-list" style="padding: 10px;"></div>
            <div style="padding: 10px; display: flex; flex-direction: column; gap: 10px;">
                <div style="color: #ff4d4d;">⚔️ МОЩ: <span id="stat-power">150</span></div>
                <div style="color: #eee;">🛡️ АРМИЯ: <span id="stat-army">500</span></div>
            </div>
        </aside>

        <section id="game-main-area" style="position: relative;">
            <div id="barracks-container" style="display: none; position: absolute; z-index: 50; width: 100%; height: 100%; background: rgba(0,0,0,0.9);"></div>
            <div id="central-display" style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.15;">
                 <h1 style="font-family: 'Cinzel'; color: #d4af37; font-size: 22px; letter-spacing: 4px;">ВЕЛИКА БЪЛГАРИЯ</h1>
            </div>
        </section>
    </main>

    <footer id="bottom-controls">
        <button onclick="window.advanceTurn()">⏳</button>
        <button onclick="window.buyUnits()">🛡️</button>
    </footer>

    <script src="database.js"></script><script src="barracks.js"></script>
    <script src="events.js"></script><script src="time.js"></script>
    <script src="ui.js"></script><script src="logic.js"></script>
</body>
</html>
