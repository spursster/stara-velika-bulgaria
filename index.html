            font-size: 1rem;

        }

            display: none !important;

            top: 0;
            left: 0;

<script>
(function initNewGameMenu() {
    const container = document.querySelector('.new-game-menu-container');
    const btn = document.getElementById('newGameBtn');
    const dropdown = document.getElementById('newGameDropdown');
    const continueOption = document.getElementById('continueGameOption');
    
    if (!btn || !dropdown) return;
    
    function checkForSavedGame() {
        const hasSave = localStorage.getItem('GreatBulgaria_SaveGame') !== null;
        if (continueOption) {
            continueOption.style.display = hasSave ? 'flex' : 'flex';
        }
        return hasSave;
    }
    
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('show');
        checkForSavedGame();
    });
    
    document.addEventListener('click', (e) => {
        if (!container.contains(e.target)) {
            dropdown.classList.remove('show');
        }
    });
    
    document.querySelectorAll('.new-game-option[data-mode]').forEach(opt => {
        opt.addEventListener('click', () => {
            const mode = opt.getAttribute('data-mode');
            dropdown.classList.remove('show');
            startNewGame(mode);
        });
    });
    
    if (continueOption) {
        continueOption.addEventListener('click', () => {
            dropdown.classList.remove('show');
            continueSavedGame();
        });
    }
    
    function startNewGame(mode) {
    localStorage.removeItem('GreatBulgaria_SaveGame');
    localStorage.removeItem('favoriteHeroesFinal');
    localStorage.removeItem('heroAutoState');
    localStorage.removeItem('barracksFavorites');
    
    window.gameMode = mode;
    
    if (typeof window.startFreshGameLogic === 'function') {
        const originalStart = window.startFreshGameLogic;
        window.startFreshGameLogic = function() {
            window.startFreshGameLogic = originalStart;
            originalStart();
        };
        window.startFreshGameLogic();
    } else {
        location.reload();
    }
}
    function continueSavedGame() {
        const hasSave = localStorage.getItem('GreatBulgaria_SaveGame') !== null;
        if (!hasSave) {
            alert("Няма запазена игра. Започнете нова игра първо.");
            return;
        }
        
        if (typeof window.loadGreatBulgariaGame === 'function') {
            const success = window.loadGreatBulgariaGame();
            if (success) {
                console.log("✅ Играта е заредена успешно");
                if (window.gameMode === 'solo' && typeof window.initSoloMode === 'function') {
                    setTimeout(() => window.initSoloMode(), 100);
                }
                if (typeof window.updateCharacterUI === 'function') {
                    window.updateCharacterUI(window.currentHero);
                }
                if (typeof window.renderTop6HeroesUI === 'function') {
                    window.renderTop6HeroesUI();
                }
                if (typeof window.renderSingleBar === 'function') {
                    window.renderSingleBar();
                }
                if (window.showAdvisorMsg) {
                    window.showAdvisorMsg("👑 Запазената игра е заредена. Продължавайте приключението!");
                } else {
                    alert("Запазената игра е заредена!");
                }
            } else {
                alert("Грешка при зареждане на запазената игра.");
            }
        } else {
            alert("Системата за зареждане не е налична.");
        }
    }
    
    const autoLoadOnStart = true;
    if (autoLoadOnStart) {
        const hasSave = localStorage.getItem('GreatBulgaria_SaveGame') !== null;
        if (hasSave) {
            setTimeout(() => {
                continueSavedGame();
            }, 300);
        }
    }
})();
</script>

<script>
(function() {
    if (window.rivalrySystem && typeof window.rivalrySystem.getEnemyHeroes === 'function') {
        const originalGetEnemy = window.rivalrySystem.getEnemyHeroes;
        window.rivalrySystem.getEnemyHeroes = function() {
            let enemies = originalGetEnemy();
            let unique = [];
            let seen = new Set();
            for (let e of enemies) {
                let id = e.id || e.name || e.clan;
                if (!seen.has(id)) {
                    seen.add(id);
                    unique.push(e);
                }
            }
            return unique;
        };
        console.log("✅ Филтър за дублиращи се врагове активиран.");
    }

    function updateHeroNameInTopBar() {
        let hero = window.currentHero;
        if (!hero) return;
        let heroName = hero.name || "Герой";
        let container = document.querySelector('#top-bar .top-bar-stats');
        if (!container) return;
        let existing = container.querySelector('.active-hero-name');
        if (!existing) {
            let span = document.createElement('span');
            span.className = 'active-hero-name';
            span.innerHTML = `👑 ${heroName}`;
            container.appendChild(span);
        } else {
            existing.innerHTML = `👑 ${heroName}`;
        }
    }
    setInterval(updateHeroNameInTopBar, 1000);
    updateHeroNameInTopBar();

    if (typeof window.openRegionsMap !== 'function') {
        window.openRegionsMap = function() {};
    }

    if (typeof window.startBattle !== 'function') {
        window.startBattle = function(region) {
            console.log(`Битка в ${region} (симулация)`);
            if (window.currentHero && window.gainHeroXP) {
                let xp = 50 + Math.floor(Math.random() * 80);
                window.gainHeroXP(window.currentHero, xp);
                if (window.addWorldEvent) window.addWorldEvent(`⚔️ Битка в ${region}`, `${window.currentHero.name} победи! +${xp} XP`, "⚔️");
                else alert(`Победа! +${xp} XP`);
            } else alert("Не може да се получи XP");
        };
    }

    if (!window.worldEvents) window.worldEvents = [];
    window.addWorldEvent = function(title, desc, icon, year) {
        window.worldEvents.unshift({ id: Date.now(), title, description: desc, icon: icon || '📜', time: year || window.gameTime?.year ? `${window.gameTime.year} г. ${window.gameTime.era}` : "480 г. пр.н.е." });
        if (window.worldEvents.length > 100) window.worldEvents.pop();
        if (typeof window.displayEvents === 'function') window.displayEvents();
        else console.log("Летопис:", title, desc);
    };
    window.displayEvents = function() {
        const cont = document.getElementById('eventsListContainer');
        if (!cont) return;
        const events = window.worldEvents || [];
        if (!events.length) { cont.innerHTML = '<div style="text-align:center; color:#888;">⏳ Няма събития</div>'; return; }
        let html = '';
        events.slice(0, 7).forEach(ev => {
            html += `<div class="chronicle-event"><div class="chronicle-icon">${ev.icon || '📜'}</div><div class="chronicle-text"><strong>${ev.title}</strong> — ${ev.description}</div><div class="chronicle-time">${ev.time}</div></div>`;
        });
        if (events.length > 7) html += `<button class="load-more-btn" onclick="window.displayEventsFull()">📖 Зареди още ${events.length-7}</button>`;
        cont.innerHTML = html;
    };
    window.displayEventsFull = function() {
        const cont = document.getElementById('eventsListContainer');
        if (!cont) return;
        let html = '';
        (window.worldEvents || []).forEach(ev => {
            html += `<div class="chronicle-event"><div class="chronicle-icon">${ev.icon || '📜'}</div><div class="chronicle-text"><strong>${ev.title}</strong> — ${ev.description}</div><div class="chronicle-time">${ev.time}</div></div>`;
        });
        cont.innerHTML = html;
    };

    if (!window.currentHero) {
        window.currentHero = {
            name: "Кубрат",
            clan: "Дуло",
            gold: 2000,
            armySize: 500,
            currentArmy: 500,
            heroPower: 150,
            level: 1,
            xp: 0,
            storedXP: 0,
            isAuto: true,
            skillPoints: 0,
            skills: { tactics: 0, endurance: 0, economy: 0, mysticism: 0, leadership: 0 },
            inventory: []
        };
        if (window.initializeHeroRPGData) window.initializeHeroRPGData(window.currentHero);
    } else {
        window.currentHero.isAuto = true;
        if (window.initializeHeroRPGData) window.initializeHeroRPGData(window.currentHero);
    }

    // ==================== ОСНОВНА ФУНКЦИЯ ЗА ХОД (ОБЕДИНЕНА) ====================
    window.updateTimeUI = function() {
        const timeSpan = document.getElementById('current-time-info');
        if (!timeSpan || !window.gameTime) return;
        const seasons = ["🌱 Пролет", "☀️ Лято", "🍂 Есен", "❄️ Зима"];
        const currentSeason = seasons[window.gameTime.seasonIndex] || "Сезон";
        timeSpan.innerHTML = `${currentSeason} ${window.gameTime.year} г. ${window.gameTime.era}`;
    };
    
    window.updateTimeUI();
    
    // Единствена дефиниция на processTurn
    window.processTurn = function() {
        // Актуализиране на времето (сезони и години)
        if (!window.gameTime) {
            window.gameTime = { seasonIndex: 0, year: 480, era: "пр.н.е." };
        }
        window.gameTime.seasonIndex++;
        if (window.gameTime.seasonIndex > 3) {
            window.gameTime.seasonIndex = 0;
            if (window.gameTime.era === "пр.н.е." && window.gameTime.year > 0) {
                window.gameTime.year--;
                if (window.gameTime.year === 0) {
                    window.gameTime.year = 1;
                    window.gameTime.era = "от н.е.";
                }
            } else {
                window.gameTime.year++;
            }
        }
        window.updateTimeUI();
        
        // Икономика
        if (typeof window.calculateEconomy === 'function') window.calculateEconomy();
        
        // Дипломация
        if (typeof window.processClanDiplomacyAutomation === 'function') window.processClanDiplomacyAutomation();
        
        // Експедиции
        if (typeof window.advanceExpeditionsTurn === 'function') window.advanceExpeditionsTurn();
        
        // Автономно завладяване на региони
        if (typeof window.autonomousRegionConquest === 'function') window.autonomousRegionConquest();

        // Пасивно възстановяване на HP за всички живи герои
if (window.worldData && window.worldData.clans) {
    for (let key in window.worldData.clans) {
        let hero = window.worldData.clans[key];
        if (hero.isJoined === true && hero.isAlive !== false) {
             // evolve heroes every turn
             if (typeof window.evolveHero === 'function') window.evolveHero(hero);
             
             // automate heroes in auto mode
             if (typeof window.automateHero === 'function') window.automateHero(hero);

             if (hero.hp < hero.maxHp) {
            let regen = Math.max(1, Math.floor(hero.maxHp * 0.05)); // 5% от maxHp
            // Бонус от умение "endurance"
            let endurance = hero.skills?.endurance || 0;
            regen += endurance;
            hero.hp = Math.min(hero.maxHp, hero.hp + regen);
            }
        }
    }
}
        // Нападения от съперници
        if (typeof window.checkRandomAttack === 'function') window.checkRandomAttack();
        
        // Опит за активния герой
        if (window.currentHero && window.gainHeroXP) window.gainHeroXP(window.currentHero, 15);
        
        // ========== НОВИ ДОБАВКИ ==========
        // 1. Легендарен герой (2% шанс)
        if (Math.random() < 0.02 && typeof window.createLegendaryHero === 'function') {
            window.createLegendaryHero();
        }
        // 2. Дуелно предизвикателство (15% шанс)
        if (Math.random() < 0.15 && typeof window.triggerRandomDuelChallenge === 'function') {
            window.triggerRandomDuelChallenge();
        }
        
        // Актуализиране на UI
        if (window.updateCharacterUI) window.updateCharacterUI(window.currentHero);
        if (window.renderTop6HeroesUI) window.renderTop6HeroesUI();
        if (typeof window.renderSingleBar === 'function') window.renderSingleBar();
        
        // Запазване на играта
        if (typeof window.saveGreatBulgariaGame === 'function') window.saveGreatBulgariaGame();
    };

    if (typeof window.toggleTreasury !== 'function') {
        window.toggleTreasury = function() {
            const hero = window.currentHero;
            if (!hero) { alert("Няма герой"); return; }
            const inv = hero.inventory || [];
            let html = '<div class="modal-overlay" id="treasuryModal"><div class="modal-content"><h2>🏺 Съкровищница</h2>';
            if (!inv.length) html += '<p>Няма артефакти.</p>';
            else {
                html += '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px;">';
                inv.forEach(i => {
                    html += `<div style="background:#1a1a2e; border:1px solid gold; border-radius:12px; padding:8px; text-align:center;">
                                <div style="font-size:30px;">${i.icon || '🏺'}</div>
                                <div>${i.name || 'Артефакт'}</div>
                                <div style="font-size:10px;">+${i.bonus?.heroPower || 0} сила</div>
                            </div>`;
                });
                html += '</div>';
            }
            html += `<button id="closeTreasury" style="margin-top:15px; background:#d4af37; border:none; border-radius:20px; padding:6px 12px;">Затвори</button></div></div>`;
            const oldM = document.getElementById('treasuryModal');
            if (oldM) oldM.remove();
            const modal = document.createElement('div');
            modal.innerHTML = html;
            document.body.appendChild(modal);
            modal.querySelector('#closeTreasury').onclick = () => modal.remove();
            modal.onclick = e => { if(e.target === modal) modal.remove(); };
        };
    }

    if (window.worldEvents.length === 0) {
        window.addWorldEvent("🏛️ Основаване на Тракийското царство", "Тракийските племена се обединяват", "🏰", "480 г. пр.н.е.");
        window.addWorldEvent("⚔️ Подготовка за война", "Персийската империя набира войски", "⚔️", "480 г. пр.н.е.");
    }
    window.displayEvents();

    if (window.updateCharacterUI) window.updateCharacterUI(window.currentHero);
    if (window.renderTop6HeroesUI) window.renderTop6HeroesUI();
    if (window.initHeroBar) window.initHeroBar();
    document.getElementById('clearChronicleBtn')?.addEventListener('click', () => {
        if(confirm("Изчисти летописа?")) { window.worldEvents = []; window.displayEvents(); }
    });
    
    console.log("✅ Играта е напълно готова (с дуели и легендарни герои)!");
})();
</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
// ==================== ИНТЕРАКТИВНА КАРТА (ФИНАЛНА ВЕРСИЯ С ПОРТАЛИ) ====================
(function() {
    // Повишаваме z-index на inspectRegion (ако се отваря)
    const originalInspect = window.inspectRegion;
    if (originalInspect) {
        window.inspectRegion = function(regionName) {
            originalInspect(regionName);
            setTimeout(() => {
                const modal = document.getElementById('region-inspect-overlay');
                if (modal) modal.style.zIndex = '300000';
            }, 50);
        };
    }

    // Генериране на карта с фиксирани размери (700x500) + поддръжка на портали
    window.generateMapCanvas = function(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return console.error(`Контейнер #${containerId} не съществува`);

        const mapWidth = 700;
        const mapHeight = 500;
        const tileMargin = 2;

        let regions = window.worldData ? Object.values(window.worldData.regions) : [];
        if (!regions.length) {
            container.innerHTML = '<div style="color:#ffaa66;">Няма заредени региони.</div>';
            return;
        }
        regions.sort((a, b) => a.name.localeCompare(b.name));
        const cols = Math.ceil(Math.sqrt(regions.length));
        const rows = Math.ceil(regions.length / cols);
        const tileWidth = (mapWidth - (cols - 1) * tileMargin) / cols;
        const tileHeight = (mapHeight - (rows - 1) * tileMargin) / rows;

        const canvas = document.createElement('canvas');
        canvas.width = mapWidth;
        canvas.height = mapHeight;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvas.style.border = '2px solid #d4af37';
        canvas.style.borderRadius = '8px';
        canvas.style.backgroundColor = '#1a1a2e';
        container.innerHTML = '';
        container.appendChild(canvas);
        window.currentMapCanvas = canvas;

        const ctx = canvas.getContext('2d');
        let ownedRegions = (window.playerRegions || []).flat();
        const regionRects = [];

        for (let i = 0; i < regions.length; i++) {
            const region = regions[i];
            const row = Math.floor(i / cols);
            const col = i % cols;
            const x = col * (tileWidth + tileMargin);
            const y = row * (tileHeight + tileMargin);
            let bgColor = '#5a5a5a';
            if (ownedRegions.includes(region.name)) bgColor = '#2c5a2a';
            else if (region.nativeClans && region.nativeClans.length) bgColor = '#8b3a3a';
            ctx.fillStyle = bgColor;
            ctx.fillRect(x, y, tileWidth, tileHeight);
            ctx.strokeStyle = '#d4af37';
            ctx.strokeRect(x, y, tileWidth, tileHeight);
            let shortName = region.name.length > 10 ? region.name.slice(0, 8) + '..' : region.name;
            ctx.fillStyle = '#ffdd99';
            ctx.font = `${Math.min(11, Math.floor(tileHeight / 4))}px Cinzel, serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(shortName, x + tileWidth / 2, y + tileHeight / 2);

            // Рисуване на иконка за активен портал (ако има)
            const hasPortal = window.activePortals && window.activePortals.some(p => p.regionName === region.name);
            if (hasPortal) {
                ctx.font = "24px sans-serif";
                ctx.fillStyle = "#00ffff";
                ctx.shadowBlur = 8;
                ctx.fillText("🌀", x + tileWidth - 20, y + 20);
                ctx.shadowBlur = 0;
            }

            regionRects.push({ region, x, y, w: tileWidth, h: tileHeight });
        }

        // Клик върху картата – приоритет на портал, иначе инспекция
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            const hit = regionRects.find(r => mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h);
            if (hit) {
                const hasPortal = window.activePortals && window.activePortals.some(p => p.regionName === hit.region.name);
                if (hasPortal && typeof window.enterMysticPortal === 'function') {
                    window.enterMysticPortal(hit.region.name);
                } else if (window.inspectRegion) {
                    window.inspectRegion(hit.region.name);
                } else {
                    alert(`Регион: ${hit.region.name}`);
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;
            const hit = regionRects.find(r => mouseX >= r.x && mouseX <= r.x + r.w && mouseY >= r.y && mouseY <= r.y + r.h);
            canvas.style.cursor = hit ? 'pointer' : 'default';
            canvas.title = hit ? `${hit.region.name} (Сила: ${hit.region.armySize})` : '';
        });
    };

    // Функция за опресняване на картата (ако е отворена)
    window.refreshMap = function() {
        const container = document.getElementById('map-container-modal');
        if (container && window.generateMapCanvas) {
            window.generateMapCanvas('map-container-modal');
        }
    };

    // Отваряне на картата в модал
    window.openInteractiveMap = function() {
        const oldModal = document.getElementById('interactive-map-modal');
        if (oldModal) oldModal.remove();
        const modal = document.createElement('div');
        modal.id = 'interactive-map-modal';
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            padding: 20px;
            box-sizing: border-box;
        `;
        modal.innerHTML = `
            <div style="background: #0a0a1a; border: 2px solid #d4af37; border-radius: 24px; padding: 20px; max-width: 90vw; max-height: 90vh; overflow: auto; text-align: center;">
                <h2 style="color:#ffd700; margin:0 0 10px 0;">🗺️ ИНТЕРАКТИВНА КАРТА</h2>
                <div id="map-container-modal" style="margin:10px 0; display: flex; justify-content: center;"></div>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                    <button id="refresh-map-btn" style="background:#2c5a2a; border:1px solid #d4af37; border-radius:30px; padding:6px 15px; color:#ffdd99; cursor:pointer;">🔄 Обнови картата</button>
                    <button id="close-map-modal" style="background:#2c1a0c; border:1px solid #d4af37; border-radius:30px; padding:6px 15px; color:#ffdd99; cursor:pointer;">Затвори</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        const mapContainer = modal.querySelector('#map-container-modal');
        const refresh = () => window.generateMapCanvas('map-container-modal');
        refresh();
        modal.querySelector('#refresh-map-btn').onclick = refresh;
        modal.querySelector('#close-map-modal').onclick = () => modal.remove();
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
    };

    // Ако искате да замените старата функция openRegionsMap:
    if (typeof window.openRegionsMap === 'function') {
        window.openRegionsMap = window.openInteractiveMap;
    }

    console.log("✅ Интерактивна карта заредена – с поддръжка на портали и refreshMap");
})();
</script>
