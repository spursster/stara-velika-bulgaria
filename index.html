<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magna Bulgaria v40 - Lore Edition</title>
<style>
:root{
  --bg:#0a0a0a;
  --panel:#141008;
  --gold:#d4af37;
  --gold-dark:#8c7322;
  --text:#e9dbb8;
  --text-dim:#bfae84;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}
body{background: radial-gradient(1200px 800px at 50% -200px,#1b140a 0%,#0a0a0a 60%)}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(180deg,#1a1308,#0e0a05);border-bottom:3px solid var(--gold);box-shadow:0 4px 12px #000}
.tb-info{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:15px}
.tb-info strong{color:var(--gold);text-shadow:0 0 8px rgba(212,175,55,.35);font-size:17px;letter-spacing:.5px}
.sep{opacity:.4}
.tb-actions button{margin-left:8px}
button{background:linear-gradient(#2a210f,#1a1408);color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:14px;transition:all.2s}
button:hover{background:linear-gradient(#3a2f18,#231a0b);box-shadow:0 0 10px rgba(212,175,55,.4);transform:translateY(-1px)}
button:active{transform:translateY(0)}button:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:340px 1fr 340px;gap:14px;padding:14px;max-width:1600px;margin:0 auto}
.panel{background:radial-gradient(ellipse at top,#1c150b 0%,#0f0a05 85%);border:2px solid var(--gold);border-radius:10px;padding:12px;box-shadow:inset 0 0 24px rgba(212,175,55,.08),0 6px 18px rgba(0,0,0,.7);position:relative}
.panel::before{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(212,175,55,.18)}
.panel h2,.panel h3{margin:0 0 10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:15px;border-bottom:1px solid rgba(212,175,55,.3);padding-bottom:6px}
.scroll{max-height:420px;overflow-y:auto;padding-right:6px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-track{background:#0a0703}.scroll::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:4px}
.army{background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.25);border-radius:8px;padding:8px;margin-bottom:9px}
.army h4{margin:0 0 4px;color:var(--gold);font-size:15px}
.army.stats{font-size:13px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
.army.leader{margin:5px 0 6px;font-size:13px}
.army button{width:100%;margin-top:4px;font-size:12px;padding:5px}
.nation{border:1px solid rgba(212,175,55,.2);border-radius:6px;padding:8px;margin-bottom:7px;background:rgba(0,0,0,.22)}
.nation.highlight{border:2px solid var(--gold);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(0,0,0,.2));box-shadow:0 0 14px rgba(212,175,55,.28)}
.nation.title{font-weight:bold;color:var(--text)}
.nation.desc{font-size:12px;color:var(--text-dim);font-style:italic;margin-top:2px}
.nation.meta{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;color:var(--gold)}
.ritual{text-align:center;padding:22px 12px}
.summon-btn{font-size:19px;padding:14px 24px;background:radial-gradient(#3a2a12,#1f1608);border:2px solid var(--gold);box-shadow:0 0 22px rgba(212,175,55,.22);margin:12px 0;letter-spacing:.5px}
.summon-btn:hover{box-shadow:0 0 32px rgba(212,175,55,.5)}
.cost{color:var(--text-dim);font-size:13px}.last{margin-top:10px;font-size:14px;min-height:22px;color:var(--gold)}
.warrior{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px dashed rgba(212,175,55,.15)}
.warrior.locked{opacity:.42;filter:grayscale(1)}
.warrior.portrait{width:38px;height:38px;border-radius:50%;background:#000;border:1px solid var(--gold-dark);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.warrior.unlocked.portrait{background:radial-gradient(#3a2a12,#1a1206);border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.3)}
.warrior.alexander.unlocked.portrait{box-shadow:0 0 16px gold,0 0 6px var(--gold)}
.warrior.name{font-weight:bold;color:var(--text);font-size:14px}
.warrior.bonus{font-size:11px;color:var(--text-dim)}
.god-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(212,175,55,.1);font-size:13px}
.god-item.locked{opacity:.34}
.god-item.gname{color:var(--text)}.god-item.gbonus{color:var(--gold);font-size:12px}
.dynasty{margin:14px auto;max-width:1600px}
.dyn-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wives{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.wives button.active{background:var(--gold);color:#000;font-weight:bold;box-shadow:0 0 12px rgba(212,175,55,.5)}
.children{display:flex;gap:16px;margin-top:8px}
.child{text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.22);border-radius:8px;padding:8px 12px;min-width:84px}
.child span{font-size:26px;display:block}.child small{color:var(--text-dim);font-size:12px}
.bonus-text{font-size:12px;color:var(--gold);margin-top:6px;min-height:16px}
.garrison-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(212,175,55,.15);font-size:13px}
.garrison-item button{font-size:11px;padding:3px 8px}
#toast-container{position:fixed;top:72px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:linear-gradient(#1c150b,#0f0a05);border:1px solid var(--gold);border-left:4px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:6px;box-shadow:0 6px 18px #000;min-width:260px;max-width:320px;animation:slideIn.3s ease;font-size:14px}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.dyn-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="toast-container"></div>
<header class="topbar">
  <div class="tb-info">
    <strong data-i18n="khan">Кан Кубрат</strong>
    <span class="sep">•</span>
    <span id="goldStat">💰 5000</span>
    <span class="sep">•</span>
    <span id="yearStat">Год. 632</span>
    <span class="sep">•</span>
    <span id="councilStat">Съвет: 65%</span>
  </div>
  <div class="tb-actions">
    <button id="btnNewGame" data-i18n="newGame">Нова Игра</button>
    <button id="btnLang">EN</button>
    <button id="btnFS" title="Fullscreen">⛶</button>
  </div>
</header>

<main class="layout">
  <aside class="left">
    <div class="panel">
      <h2 data-i18n="armies">Трите Армии</h2>
      <div id="armiesList"></div>
    </div>
    <div class="panel">
      <h2 data-i18n="nations">Народи на България</h2>
      <div id="nationsList"></div>
    </div>
    <div class="panel">
      <h2>Имперски Съвет</h2>
      <div id="councilList" class="scroll"></div>
    </div>
    <div class="panel">
      <h3 data-i18n="garrisons">Гарнизони</h3>
      <div id="garrisonsList"></div>
    </div>
  </aside>

  <section class="center">
    <div class="panel ritual">
      <h2 data-i18n="ritual">Свещен Ритуал</h2>
      <button id="btnSummon" class="summon-btn">Извикай Бог / Summon God</button>
      <div class="cost" data-i18n="cost">Цена: 100 злато</div>
      <div id="lastSummon" class="last">Последно: —</div>
      <button id="btnNextTurn" class="summon-btn" style="margin-top:18px;font-size:17px" data-i18n="nextTurn">▶ Нов Ход</button>
      <div class="cost" data-i18n="nextInfo">+10 злато, +1 година</div>
    </div>
    <div class="panel gods">
      <h3 data-i18n="gods">Богове (69)</h3>
      <div id="godsList" class="scroll"></div>
    </div>
  </section>

  <aside class="right">
    <div class="panel">
      <h2 data-i18n="legendary">Легендарни Войни</h2>
      <div id="warriorsList" class="scroll"></div>
    </div>
  </aside>
</main>

<footer class="panel dynasty">
  <h3 data-i18n="dynasty">Династия Дуло</h3>
  <div class="dyn-grid">
    <div>
      <label data-i18n="wife">Избери съпруга:</label>
      <div class="wives">
        <button data-wife="byzantine" data-i18n="byzantine">Византийска принцеса</button>
        <button data-wife="khazar" data-i18n="khazar">Хазарска ханша</button>
        <button data-wife="avar" data-i18n="avar">Аварска дъщеря</button>
      </div>
      <div id="wifeBonus" class="bonus-text"></div>
    </div>
    <div>
      <label data-i18n="children">Наследници:</label>
      <div class="children">
        <div class="child"><span>👑</span><small>Батбаян</small></div>
        <div class="child"><span>⚔️</span><small>Аспарух</small></div>
        <div class="child"><span>🐎</span><small>Котраг</small></div>
      </div>
    </div>
  </div>
</footer>

<script>
(() => {
const T = {
 bg:{
  khan:'Кан Кубрат',dynastyDulo:'Династия Дуло',armies:'Трите Армии',infantry:'Пехота',cavalry:'Конница',leader:'Вожд',assign:'Назначи вожд',
  ritual:'Свещен Ритуал',cost:'Цена: 100 злато',last:'Последно',none:'—',legendary:'Легендарни Войни',nations:'Народи на България',loyalty:'Лоялност',
  garrisons:'Гарнизони',recruit:'Набери +100',dynasty:'Династия Дуло',wife:'Избери съпруга',children:'Наследници',gods:'Богове (69)',
  attack:'атака',canKill:'Може да убие бог: 5%',summonedGod:'Призован бог',summonedWarrior:'Призован герой',nothing:'Ритуалът замлъкна',
  noGold:'Нямаш достатъчно злато!',noWarriors:'Няма свободни герои',challenge:'предизвиква',killed:'убит от',survived:'оцеля',
  byzantine:'Византийска принцеса',khazar:'Хазарска ханша',avar:'Аварска дъщеря',
  newGame:'Нова Игра',nextTurn:'▶ Нов Ход',nextInfo:'+10 злато, +1 година',turnDone:'Ход',
 },
 en:{
  khan:'Khan Kubrat',dynastyDulo:'Dulo Dynasty',armies:'Three Armies',infantry:'Infantry',cavalry:'Cavalry',leader:'Leader',assign:'Assign Leader',
  ritual:'Sacred Ritual',cost:'Cost: 100 gold',last:'Last',none:'—',legendary:'Legendary Warriors',nations:'Peoples of Bulgaria',loyalty:'Loyalty',
  garrisons:'Garrisons',recruit:'Recruit +100',dynasty:'Dulo Dynasty',wife:'Choose Wife',children:'Heirs',gods:'Gods (69)',
  attack:'attack',canKill:'Can kill gods: 5%',summonedGod:'God summoned',summonedWarrior:'Hero summoned',nothing:'The ritual was silent',
  noGold:'Not enough gold!',noWarriors:'No free heroes',challenge:'challenges',killed:'slain by',survived:'survived',
  byzantine:'Byzantine Princess',khazar:'Khazar Khansha',avar:'Avar Daughter',
  newGame:'New Game',nextTurn:'▶ Next Turn',nextInfo:'+10 gold, +1 year',turnDone:'Turn',
 }
};

const godsPool = [/*... съкратено за място, използвай твоя пълен списък... */];
const warriorsPool = [/*... твоя пълен списък... */];
const nations = [
{id:'macedonians',name_bg:'Македонци (Македония)',name_en:'Macedonians (Macedonia)',desc_bg:'Древен български род',desc_en:'Ancient Bulgarian kin',loyalty:100,bonus_bg:'+25% пехота',bonus_en:'+25% infantry',highlight:true},
{id:'thracians',name_bg:'Траки (Тракия)',name_en:'Thracians (Thrace)',loyalty:95,bonus_bg:'+15% конница',bonus_en:'+15% cavalry'},
{id:'moesians',name_bg:'Мизи (Мизия) - включва Видин',name_en:'Moesians (Moesia) – includes Vidin',loyalty:92,bonus_bg:'+10% стабилност',bonus_en:'+10% stability'},
{id:'dobrudja',name_bg:'Добруджанци',name_en:'Dobrudjans',loyalty:88,bonus_bg:'+20% флот',bonus_en:'+20% fleet'},
{id:'shopi',name_bg:'Шопи',name_en:'Shopi',loyalty:90,bonus_bg:'+12% данък',bonus_en:'+12% tax'},
];

const COUNCIL = [
 {id:'dulo',n:'Дуло',v:3,b:'+20% злато',l:100},{id:'asenevtsi',n:'Асеневци',v:2,b:'+30% злато',l:75},
 {id:'komitopuli',n:'Комитопули',v:2,b:'+25% защита',l:85},{id:'shishman',n:'Шишмановци',v:2,b:'+20% култура',l:80},
 {id:'makedoni',n:'Македони',v:2,b:'+40% армия',l:40},{id:'odrisi',n:'Одриси',v:1,b:'+20% храна',l:90},
 {id:'vokil',n:'Вокил',v:1,b:'+15% армия',l:70},{id:'ugain',n:'Угаин',v:1,b:'+10% храна',l:60},
 {id:'terter',n:'Тертер',v:1,b:'+15% търговия',l:65},{id:'smilets',n:'Смилец',v:1,b:'+10% всичко',l:55},
 {id:'ptolomei',n:'Птоломеи',v:1,b:'+30% наука',l:50},{id:'besarab',n:'Бесараб',v:1,b:'+15% злато',l:70},
 {id:'osman',n:'Османци',v:1,b:'+25% армия',l:30},
];

const defaultState = {
 lang:'bg',gold:5000,year:632,lastSummon:null,wife:null,council:{},
 gods:[],warriors:[],
 armies:{
  left:{name_bg:'Батбаянова Орда',name_en:"Batbayan's Horde",infantry:4200,cavalry:1800,leader:null},
  center:{name_bg:'Кубратова Дружина',name_en:"Kubrat's Retinue",infantry:5500,cavalry:2500,leader:null},
  right:{name_bg:'Аспарухова Стрела',name_en:"Asparuh's Arrow",infantry:3000,cavalry:3400,leader:null},
 },
 garrisons:{pliska:1200,phanagoria:800,ongul:600}
};

let state = loadState() || JSON.parse(JSON.stringify(defaultState));
if(!state.council || Object.keys(state.council).length===0){COUNCIL.forEach(d=>state.council[d.id]=d.l)}

function saveState(){localStorage.setItem('mb_v40_lore',JSON.stringify(state))}
function loadState(){try{const s=localStorage.getItem('mb_v40_lore');return s?JSON.parse(s):null}catch(e){return null}}
function toast(msg){const c=document.getElementById('toast-container');const d=document.createElement('div');d.className='toast';d.textContent=msg;c.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(40px)';setTimeout(()=>d.remove(),300)},3800)}
function applyTranslations(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(T[state.lang][k]) el.textContent=T[state.lang][k]});document.getElementById('btnLang').textContent=state.lang==='bg'?'EN':'BG'}
function updateTop(){document.getElementById('goldStat').textContent=`💰 ${state.gold.toLocaleString()}`;document.getElementById('yearStat').textContent=state.lang==='bg'?`Год. ${state.year}`:`Year ${state.year}`}

function renderArmies(){/* твоя код */ }
function renderNations(){/* твоя код */ }
function renderGarrisons(){/* твоя код */ }
function renderWarriors(){/* твоя код */ }
function renderGods(){/* твоя код */ }
function renderLast(){/* твоя код */ }
function renderDynasty(){/* твоя код */ }

function renderCouncil(){
 const el=document.getElementById('councilList'); if(!el) return; el.innerHTML='';
 let tot=0,tv=0;
 COUNCIL.forEach(d=>{
  const loy = state.council[d.id]??d.l;
  tot+=loy*d.v; tv+=d.v;
  const cls = loy>=70?'highlight':'';
  el.innerHTML+=`<div class="nation ${cls}"><div class="title">${d.n} <span style="color:var(--gold)">(${d.v} гласа)</span></div><div class="desc">${d.b}</div><div class="meta"><span>Лоялност: ${loy}%</span><button onclick="bribeCouncil('${d.id}')" style="font-size:11px;padding:2px 6px">Подкупи</button></div></div>`;
 });
 const avg=Math.round(tot/tv);
 document.getElementById('councilStat').textContent = state.lang==='bg'?`Съвет: ${avg}%`:`Council: ${avg}%`;
}
window.bribeCouncil=function(id){if(state.gold<100){toast(T[state.lang].noGold);return}state.gold-=100;state.council[id]=Math.min(100,(state.council[id]??70)+15);saveState();updateUI();toast('Подкуп успешен')};

function updateUI(){applyTranslations();updateTop();renderArmies();renderNations();renderGarrisons();renderWarriors();renderGods();renderLast();renderDynasty();renderCouncil();document.getElementById('btnSummon').disabled=state.gold<100}

//... останалите твои функции doRitual, nextTurn и т.н. остават същите...

updateUI();
})();
</script>
</body>
</html>
