<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Bulgaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1 style="text-align: center; color: #d4af37; margin: 10px 0;">EPIC BULGARIA</h1>
        
        <!-- Топ бар със статистики -->
        <div class="top-bar">
            <span>📅 <span id="game-year">1</span> г.</span>
            <span>🪙 <span id="game-gold">500</span></span>
        </div>

        <!-- Събития - преместени нагоре по твое желание -->
        <div id="event-log"></div>

        <!-- Основен панел на героя и регионите -->
        <div id="character-panel"></div>
    </div>

<!-- Първо зареждаме данните и логиката -->
<script src="logic.js"></script>
<script src="world_data.js"></script>
<script src="database.js"></script>

<!-- След това механиките -->
<script src="mechanics.js"></script>
<script src="economy.js"></script>
<script src="barracks.js"></script>
<script src="events.js"></script>
<script src="battle.js"></script>
<script src="diplomacy.js"></script>
<script src="time.js"></script>

<!-- Накрая интерфейса, който използва горните функции -->
<script src="ui.js"></script>
    <script>
        // Инициализация на играта
        window.currentHero = new window.Character("Терес", "Одриси", "Войнолюбец");
        window.updateCharacterUI(window.currentHero);
    </script>
</body>
</html>
