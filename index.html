<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велика България - Стратегия</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; }
        #game-container { display: flex; height: 100vh; }
        #main-view { flex: 2; padding: 20px; border-right: 2px solid #444; display: flex; flex-direction: column; }
        #character-panel { flex: 1; padding: 20px; background: #262626; overflow-y: auto; border-left: 2px solid #d4af37; }
        #world-map { height: 300px; background: #000; border: 1px solid #d4af37; display: flex; align-items: center; justify-content: center; margin: 20px 0; color: #555; }
        #event-log { flex-grow: 1; background: #111; padding: 10px; overflow-y: auto; border: 1px solid #333; font-size: 13px; color: #ccc; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="main-view">
            <header>
                <h1 style="color: #d4af37; margin: 0;">💡 Велика България</h1>
                <div class="stats-bar">
                    <span id="game-date" style="color: #fff;">Година: 480 пр.н.е.</span>
                    <span id="gold-display" style="color: #ffd700; font-weight: bold;">Злато: 500 🪙</span>
                </div>
            </header>

            <div id="world-map">КАРТА НА РЕГИОНА</div>

            <div id="event-log">
                <p>ℹ️ "Летописите започват тук. Владетелю, поемете управлението."</p>
            </div>
        </div>

        <aside id="character-panel">
            <p>Зареждане на династията...</p>
        </aside>
    </div>

    <!-- ВАЖНО: Скриптовете трябва да са в този ред -->
    <script src="world_data.js"></script>
    <script src="database.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="diplomacy.js"></script>
    <script src="regions.js"></script>
    <script src="battle.js"></script>
    <script src="events.js"></script>
    <script src="time.js"></script>
    <script src="ui.js"></script>

    <script>
        window.onload = function() {
            console.log("Стартиране на Велика България...");
            // Инициализация на първия владетел
            if (typeof Character === 'function') {
                window.currentHero = new Character("Терес", "Одриси");
                if (typeof updateCharacterUI === 'function') {
                    window.updateCharacterUI(window.currentHero);
                    window.updateGoldDisplay();
                }
            } else {
                console.error("Грешка: Неуспешно зареждане на основните класове!");
            }
        };
    </script>
</body>
</html>
