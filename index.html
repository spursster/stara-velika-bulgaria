<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <title>Stara Velika Bulgaria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="app" class="app-root">

    <!-- TOP BAR -->
    <header id="topbar"></header>

    <!-- MAIN LAYOUT -->
    <main class="layout">

      <!-- LEFT PANEL (Dynasties, Council, Characters) -->
      <aside id="panel-left" class="panel-left"></aside>

      <!-- MAP SCENE (Central map) -->
      <section id="map-scene" class="map-scene"></section>

      <!-- RIGHT PANEL (Expeditions, Details, Events) -->
      <aside id="panel-right" class="panel-right"></aside>

    </main>

    <!-- BOTTOM BAR (Turn, Year, Actions) -->
    <div id="bottom-bar" class="bottom-bar"></div>

    <!-- MODALS -->
    <div id="modals-root"></div>

  </div>

  <!-- SCRIPTS -->
  <script src="config.js"></script>
  <script src="registry.js"></script>
  <script src="i18n.js"></script>
  <script src="turn_manager.js"></script>
  <script src="ui_layout.js"></script>

  <!-- UI PANELS -->
  <script src="ui_panels/topbar.js"></script>
  <script src="ui_panels/dynasties_panel.js"></script>
  <script src="ui_panels/map_scene.js"></script>

  <!-- MAIN -->
  <script src="main.js"></script>
</body>
</html>
