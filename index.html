            <h1 style="color:#ffd700;">ЕВАЛА ДАРА !</h1>

<!-- Инициализация на новия интерфейс -->
<script>
    (function() {
        // Изграждане на командния панел
        function buildCommandPanel() {
            const rightPanel = document.getElementById('sidebar-right');
            if (!rightPanel) return;
            rightPanel.innerHTML = '';

            // 1. Статистики
            const statsDiv = document.createElement('div');
            statsDiv.className = 'command-stats';
            statsDiv.innerHTML = `
                <div class="stat-item">⚔️ <span id="cmd-power">0</span></div>
                <div class="stat-item">💰 <span id="cmd-gold">0</span></div>
                <div class="stat-item">🏹 <span id="cmd-army">0</span></div>
                <div class="stat-item">⏳ <span id="cmd-time">пролет, 480 г. пр.н.е.</span></div>
            `;
            rightPanel.appendChild(statsDiv);

            // 2. Бутони
            const btnsDiv = document.createElement('div');
            btnsDiv.className = 'command-buttons';

            const buttons = [
                { icon: '🗺️', text: 'Карта', action: 'window.openInteractiveMap()' },
                { icon: '🏹', text: 'Казарми', action: 'if(window.openBarracksUI) window.openBarracksUI(); else alert("Казармите не са достъпни")' },
                { icon: '⚔️', text: 'Битка', action: 'window.startBattle("Мизия")' },
                { icon: '►', text: 'Ход', class: 'next-turn-btn', action: 'window.processTurn()' },
                { icon: '📜', text: 'Събития', action: 'window.openEventsMenu?.()' },
                { icon: '🧭', text: 'Експедиции', action: 'window.openExpeditionsMenu?.()' },
                { icon: '🎒', text: 'Съкровищница', action: 'window.toggleTreasury()' },
                { icon: '🎖️', text: 'Турнир', action: 'window.tournament.start()' },
                { icon: '👑', text: 'Наеми герой', action: 'window.hireNewHero?.()' },
                { icon: '⬚', text: 'Цял екран', action: 'window.toggleGameFullScreen?.()' },
                { icon: '🏪', text: 'Пазар', action: 'window.armyMarket?.show?.()' },
                { icon: '💒', text: 'Брак', action: 'window.openMarriageMenu()' },
                { icon: '🕊️', text: 'Дипломация', action: 'window.openDiplomacyHub?.()' },
                { icon: '🏆', text: 'Класации', action: 'window.showLeaderBoardModal()' }
            ];

            buttons.forEach(cfg => {
                const btn = document.createElement('button');
                btn.innerHTML = `${cfg.icon} ${cfg.text}`;
                if (cfg.class) btn.classList.add(cfg.class);
                else btn.classList.add('command-btn');
                btn.setAttribute('onclick', cfg.action);
                btnsDiv.appendChild(btn);
            });

            // Бутон "Нова игра"
            const newGameBtn = document.createElement('button');
            newGameBtn.innerHTML = '🎮 Нова игра / Продължи';
            newGameBtn.classList.add('command-new-game');
            newGameBtn.onclick = () => {
                if (typeof window.showGameModeModal === 'function') window.showGameModeModal();
                else alert("Системата за нова игра не е готова.");
            };
            btnsDiv.appendChild(newGameBtn);

            rightPanel.appendChild(btnsDiv);
        }

        // Пренасочване на updateTotalStatsUI
        window.updateTotalStatsUI = function() {
            let totalGold = 0, totalArmy = 0, totalPower = 0;
            if (window.worldData && window.worldData.clans) {
                for (let key in window.worldData.clans) {
                    let hero = window.worldData.clans[key];
                    if (hero && hero.isJoined === true && hero.isAlive !== false) {
                        totalGold += hero.gold || 0;
                        totalArmy += hero.armySize || 0;
                        totalPower += hero.heroPower || 0;
                    }
                }
            }
            const goldSpan = document.getElementById('cmd-gold');
            const armySpan = document.getElementById('cmd-army');
            const powerSpan = document.getElementById('cmd-power');
            if (goldSpan) goldSpan.innerText = totalGold;
            if (armySpan) armySpan.innerText = totalArmy;
            if (powerSpan) powerSpan.innerText = totalPower;

            // Обновяване на времето
            const timeSpan = document.getElementById('cmd-time');
            if (timeSpan && window.gameTime) {
                const seasons = ["🌱 Пролет", "☀️ Лято", "🍂 Есен", "❄️ Зима"];
                const season = seasons[window.gameTime.seasonIndex] || "Сезон";
                timeSpan.innerText = `${season} ${window.gameTime.year} г. ${window.gameTime.era}`;
            }

            // Обновяване на топ героя в центъра
            const strongest = window.getStrongestHero();
            const profileBox = document.getElementById('active-character-profile');
            if (profileBox && strongest) {
                let petStatus = "Няма";
                if (strongest.pet && window.rpgDatabase?.petsDatabase?.[strongest.pet]) {
                    const p = window.rpgDatabase.petsDatabase[strongest.pet];
                    petStatus = p.icon + " " + p.name;
                }
                profileBox.innerHTML = `
                    <div style="background:rgba(0,0,0,0.5); border-radius:16px; padding:12px;">
                        <div style="font-weight:bold; font-size:1rem; color:#ffd700;">🏆 Най-силен герой</div>
                        <div style="font-weight:bold;font-size:1.2rem;">${strongest.name || "Неизвестен"}</div>
                        <div>Клан ${strongest.clan || "Свободен"} | ${window.getClassIcon ? window.getClassIcon(strongest.currentClass) : '⚔️'} Клас: ${strongest.currentClass || "Багатур"}</div>
                        <div>Ниво: ${strongest.level || 1} | Възраст: ${strongest.age || 50} г.</div>
                        <div>Бойна Сила: ⚔️ ${strongest.heroPower || 150}</div>
                        <div>Свободни точки: ${strongest.skillPoints || 0}</div>
                        <div>Любимец: ${petStatus}</div>
                    </div>
                `;
            }
        };
        window.updateStrongestHeroUI = window.updateTotalStatsUI;

        // Пренасочване на renderFavoriteHeroesBar за вертикален вид
        const originalRenderFav = window.renderFavoriteHeroesBar;
        window.renderFavoriteHeroesBar = function() {
            if (originalRenderFav) originalRenderFav();
            const slots = document.querySelectorAll('.favorite-slot');
            slots.forEach(slot => {
                slot.style.display = 'flex';
                slot.style.flexDirection = 'row';
                slot.style.alignItems = 'center';
                slot.style.gap = '8px';
                slot.style.padding = '6px 8px';
                slot.style.minHeight = '55px';
                slot.style.width = '100%';
                slot.style.justifyContent = 'flex-start';
                // Скриваме излишните детайли
                slot.querySelectorAll('.hero-level-power, .hero-stats, .hp-bar, .xp-bar, .auto-badge').forEach(el => el.style.display = 'none');
                const icon = slot.querySelector('.hero-icon');
                if (icon) icon.style.fontSize = '28px';
                const name = slot.querySelector('.hero-name');
                if (name) name.style.fontSize = '11px';
            });
        };

        // Извикване при старт
        window.addEventListener('DOMContentLoaded', () => {
            buildCommandPanel();
            if (typeof window.renderFavoriteHeroesBar === 'function') window.renderFavoriteHeroesBar();
            if (typeof window.updateTotalStatsUI === 'function') window.updateTotalStatsUI();
            // Актуализация на статистиките всяка секунда
            setInterval(() => {
                if (typeof window.updateTotalStatsUI === 'function') window.updateTotalStatsUI();
            }, 1000);
        });
    })();
</script>
