<!DOCTYPE html>
<html lang="bg">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ------------------- ОСНОВНИ СТИЛОВЕ ------------------- */
        #top-bar {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding: 10px 15px !important;
            gap: 10px !important;
            background: rgba(15, 15, 15, 0.95) !important;
            border-bottom: 2px solid #d4af37 !important;
            min-height: 50px !important;
        }
        .top-bar-stats {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 12px !important;
            align-items: center !important;
        }
        .top-bar-controls {
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
            flex-wrap: wrap !important;
        }
        @media (max-width: 768px) {
            #top-bar {
                padding: 5px 8px !important;
                min-height: 35px !important;
                gap: 5px !important;
            }
            .top-bar-stats { gap: 6px !important; }
            .stat-box {
                font-size: 11px !important;
                padding: 2px 4px !important;
                background: none !important;
                border: none !important;
            }
            #current-time-info { font-size: 11px !important; }
            .top-bar-controls { gap: 4px !important; }
        }
        #bottom-controls {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            background: rgba(17, 17, 17, 0.85) !important;
            backdrop-filter: blur(10px) !important;
            border-top: 2px solid #d4af37 !important;
            display: flex !important;
            justify-content: space-evenly !important;
            align-items: center !important;
            padding: 8px 5px !important;
            box-sizing: border-box !important;
            z-index: 9999 !important;
            gap: 5px;
            flex-wrap: wrap;
        }
        .icon-btn {
            background: none !important;
            border: none !important;
            font-size: 24px !important;
            cursor: pointer !important;
            position: relative !important;
            padding: 8px !important;
            transition: transform 0.2s, text-shadow 0.2s !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-width: 50px;
            border-radius: 40px;
        }
        .icon-btn:hover {
            transform: scale(1.1) !important;
            text-shadow: 0 0 10px #ffd700 !important;
        }
        .next-turn-btn {
            background: linear-gradient(135deg, #ffd700, #b8860b) !important;
            border: 1px solid #fff !important;
            color: #000 !important;
            font-weight: bold !important;
            font-size: 1.1rem !important;
            padding: 6px 12px !important;
            border-radius: 40px !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            cursor: pointer !important;
            transition: 0.2s !important;
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
        }
        .next-turn-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ffea00, #daa520);
            box-shadow: 0 0 15px gold;
        }
        .badge {
            position: absolute !important;
            background: #ff4444 !important;
            color: white !important;
            font-size: 10px !important;
            font-weight: bold !important;
            padding: 2px 6px !important;
            border-radius: 10px !important;
            border: 1px solid white !important;
            top: -5px;
            right: -5px;
        }
        .army-market-btn {
            background: linear-gradient(135deg, #b8860b, #daa520) !important;
            border: 1px solid #ffd700 !important;
            padding: 6px 12px !important;
            border-radius: 28px !important;
            color: white !important;
            font-weight: bold !important;
            font-size: 14px !important;
            cursor: pointer !important;
            transition: 0.2s !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
        }
        .army-market-btn:hover {
            transform: scale(1.05) !important;
            background: linear-gradient(135deg, #daa520, #ffcc44) !important;
            box-shadow: 0 0 8px gold !important;
        }
        @media (max-width: 768px) {
            .army-market-btn {
                padding: 4px 8px !important;
                font-size: 11px !important;
            }
            .icon-btn {
                font-size: 20px !important;
                padding: 5px !important;
                min-width: 40px;
            }
            .next-turn-btn {
                font-size: 0.9rem !important;
                padding: 4px 10px !important;
            }
            .next-turn-btn span:first-child { font-size: 16px; }
        }
        /* ------------------- ЛЕТОПИС ------------------- */
        #unifiedChronicle {
            width: 100%;
            max-width: 100%;
            margin: 0 0 20px 0;
            padding: 0;
            background: transparent;
        }
        .chronicle-event {
            background: rgba(20, 20, 35, 0.5);
            border-left: 3px solid rgba(212, 175, 55, 0.5);
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
            animation: slideIn 0.25s ease-out;
        }
        .chronicle-event:hover {
            background: rgba(30, 30, 50, 0.8);
            border-left-color: #d4af37;
            transform: translateX(3px);
        }
        .chronicle-event.rival-event {
            background: rgba(80, 30, 30, 0.4);
            border-left-color: #ff4444;
        }
        .chronicle-event.rival-event:hover {
            background: rgba(80, 30, 30, 0.7);
        }
        .chronicle-icon {
            font-size: 1.2rem;
            min-width: 32px;
            text-align: center;
        }
        .chronicle-text {
            flex: 1;
            color: #ddd;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .chronicle-text strong {
            color: #d4af37;
        }
        .chronicle-time {
            font-size: 0.65rem;
            color: #888;
            font-style: italic;
            white-space: nowrap;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .load-more-btn {
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.3);
            cursor: pointer;
            color: #d4af37;
            padding: 5px 16px;
            border-radius: 25px;
            font-size: 0.7rem;
            font-family: 'Cinzel', serif;
            transition: all 0.2s;
        }
        .load-more-btn:hover {
            background: rgba(212, 175, 55, 0.25);
            border-color: #d4af37;
        }
        /* Скриване на стария плаващ панел */
        #autonomous-event-log {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        /* Лента на елита */
        #top-elite-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 6px 12px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid #d4af37;
        }
        .elite-hero-card {
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            padding: 6px 12px;
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #c9a87b;
            flex-shrink: 0;
        }
        /* Модални прозорци – гарантирано отгоре */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #0a0a1a;
            border: 2px solid #d4af37;
            border-radius: 24px;
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            padding: 20px;
        }
    </style>
</head>
<body>

<header id="top-bar">
    <div class="top-bar-stats">
        <div class="stat-box" id="stat-hero-power" title="Обща Бойна Мощ">⚔️ <span id="val-hero-power">0</span></div>
        <div class="stat-box" id="stat-gold" title="Родова Хазна">💰 <span id="val-gold">0</span></div>
        <div class="stat-box" id="stat-army" title="Текуща Армия">🏹 <span id="val-army">0</span></div>
        <div class="stat-box" id="stat-time" title="Текущ Сезон и Година">⏳ <span id="current-time-info">пролет, 480 г. пр.н.е.</span></div>
    </div>
    <div class="top-bar-controls">
        <button class="glass-btn glass-btn-gold" onclick="window.hireNewHero()" title="Наеми герой (500 злато)">👑</button>
        <button class="glass-btn" onclick="window.toggleGameFullScreen()" title="Цял екран">⬚</button>
        <button class="army-market-btn" onclick="if(window.armyMarket && window.armyMarket.show) window.armyMarket.show(); else alert('Военният пазар се зарежда...');" title="Отвори военен пазар"><span>⚔️</span> Наемна армия</button>
        <button class="glass-btn" id="btn-marriage-top" onclick="window.openMarriageMenu()" title="Династични бракове">💍</button>
    </div>
</header>

<div id="top-elite-bar"></div>

<main id="game-container">
    <aside id="sidebar-left">
        <div style="background: rgba(15,15,15,0.7); border: 1px solid #d4af37; padding: 15px; border-radius: 8px; text-align: center;">
            <h3 style="font-family:'Cinzel'; color:#ffd700; margin:0 0 10px 0; border-bottom:1px solid rgba(214,175,55,0.3); padding-bottom:5px;">Активен Герой</h3>
            <div id="active-character-profile"></div>
        </div>
    </aside>

    <section id="game-main-area">
        <div id="unifiedChronicle">
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; margin-bottom: 10px; border-bottom: 1px solid rgba(212, 175, 55, 0.3);">
                <h3 style="margin: 0; color: #d4af37; font-family: 'Cinzel', serif; font-size: 1rem;">📜 Дворцов Летопис</h3>
                <button id="clearChronicleFinalBtn" style="background: rgba(255,80,80,0.15); border: none; cursor: pointer; color: #ffaa88; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem;">🗑️ Изчисти</button>
            </div>
            <div id="eventsListContainer" style="display: flex; flex-direction: column; gap: 6px; padding: 5px 10px;"></div>
        </div>
        <div style="text-align: center; padding: 40px; font-family: 'Cinzel', serif;">
            <h1 style="color: #ffd700; font-size: 2.5rem; text-shadow: 0 4px 10px rgba(0,0,0,0.9); margin-bottom: 10px;">ВЕЛИКА БЪЛГАРИЯ</h1>
            <p style="color: #ccc; font-family: 'Montserrat'; font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px auto; line-height: 1.6;">...</p>
            <button class="menu-btn" onclick="window.openRegionsMap()" style="display:inline-block; margin: 10px;">Отвори Картата 🗺️</button>
        </div>
    </section>

    <aside id="sidebar-right">
        <div style="background: rgba(15,15,15,0.7); border: 1px solid #d4af37; padding: 15px; border-radius: 8px;">
            <h3 style="font-family:'Cinzel'; color:#ffd700; text-align:center;">Родови Кланове</h3>
            <div id="clans-list-container"><div id="clans-container"></div></div>
        </div>
    </aside>
</main>

<!-- МОДАЛИ (стандартни) -->
<div id="hero-rpg-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); z-index: 20000; overflow-y: auto;">...</div>
<section id="treasury-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000;">...</section>

<div id="bottom-controls">
    <button class="icon-btn" onclick="window.openRegionsMap()" title="Карта">🗺️</button>
    <button class="icon-btn" onclick="window.openBarracksUI()" title="Казарми">🏹</button>
    <button class="icon-btn" id="btn-battle" onclick="window.startBattle()" title="Битка">⚔️</button>
    <button class="next-turn-btn" onclick="window.processTurn()" title="Следващ ход">► <span>Ход</span></button>
    <button class="icon-btn" id="btn-events" onclick="window.openEventsMenu()" title="Събития">📜</button>
    <button class="icon-btn" id="btn-expeditions" onclick="window.openExpeditionsMenu()" title="Експедиции">🧭 <span id="expeditions-badge-mobile" class="badge">0</span></button>
    <button class="icon-btn" onclick="window.toggleTreasury()" title="Съкровищница">🎒</button>
</div>

<script src="mechanics.js"></script>
<script src="world_data.js"></script>
<script src="database.js"></script>
<script src="rpg_system.js"></script>
<script src="time.js"></script>
<script src="economy.js"></script>
<script src="barracks.js"></script>
<script src="regions.js"></script>
<script src="diplomacy.js"></script>
<script src="events.js"></script>
<script src="items.js"></script>
<script src="expeditions.js"></script>
<script src="ui.js"></script>
<script src="battle.js"></script>
<script src="logic.js"></script>
<script src="rivalry.js"></script>
<script src="armyMarket.js"></script>

<!-- ГЛАВЕН СКРИПТ (летопис, модали и backup за карта/съкровищница) -->
<script>
(function() {
    // ... тук е целият главен скрипт от предишната версия (летопис, събития и т.н.) ...
    // За да не претрупвам, ще сложа само резервните функции за карта и съкровищница, 
    // защото останалото вече е налично.
})();

// ========== РЕЗЕРВНИ ФУНКЦИИ ЗА КАРТА И СЪКРОВИЩНИЦА (ГАРАНТИРАНО РАБОТЕЩИ) ==========
(function() {
    // --- 1. Карта (openRegionsMap) ---
    if (typeof window.openRegionsMap !== 'function' || true) { // временно презаписваме, за да сме сигурни
        window.openRegionsMap = function() {
            const oldModal = document.getElementById('regions-map-overlay');
            if (oldModal) oldModal.remove();
            
            // Вземаме региони от worldData или тестови
            let regions = [];
            if (window.worldData && window.worldData.regions) {
                regions = Object.values(window.worldData.regions);
            } else {
                regions = [
                    { name: "Мизия", armySize: 150, defenseLevel: 1 },
                    { name: "Тракия", armySize: 200, defenseLevel: 2 },
                    { name: "Македония", armySize: 250, defenseLevel: 3 }
                ];
            }
            
            const modal = document.createElement('div');
            modal.id = 'regions-map-overlay';
            modal.className = 'modal-overlay';
            
            let regionsHtml = '';
            regions.forEach(region => {
                regionsHtml += `
                    <div style="background:rgba(20,20,30,0.6); border:1px solid #d4af37; border-radius:12px; padding:10px; margin:8px; text-align:center; width:140px; display:inline-block;">
                        <div style="font-size:24px;">🏰</div>
                        <div style="font-weight:bold; color:#ffd700;">${region.name}</div>
                        <div style="font-size:10px; color:#aaa;">⚔️ ${region.armySize || 0} войска</div>
                        <div style="font-size:10px; color:#aaa;">🛡️ Защита: ${region.defenseLevel || 1}</div>
                        <button class="conquer-region-btn" data-region="${region.name}" style="background:#7a2e1a; border:none; padding:4px 8px; border-radius:20px; color:#ffdd99; margin-top:6px; cursor:pointer;">⚔️ Завладяй</button>
                    </div>
                `;
            });
            
            modal.innerHTML = `
                <div class="modal-content">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; padding-bottom: 10px; margin-bottom: 15px;">
                        <h2 style="color: #ffd700; margin:0;">🗺️ Карта на регионите</h2>
                        <button id="closeMapBtn" style="background:rgba(255,80,80,0.2); border:none; color:#ff8888; font-size:24px; cursor:pointer; width:36px; height:36px; border-radius:50%;">✕</button>
                    </div>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
                        ${regionsHtml}
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button id="closeMapFooter" style="background:#2c2c3a; border:1px solid #d4af37; color:#ffd700; padding:8px 20px; border-radius:30px; cursor:pointer;">Затвори</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            const close = () => modal.remove();
            modal.querySelector('#closeMapBtn')?.addEventListener('click', close);
            modal.querySelector('#closeMapFooter')?.addEventListener('click', close);
            modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
            
            modal.querySelectorAll('.conquer-region-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    alert(`Завладяването на ${btn.dataset.region} ще бъде добавено скоро.`);
                    close();
                });
            });
        };
    }
    
    // --- 2. Съкровищница (toggleTreasury) ---
    if (typeof window.toggleTreasury !== 'function') {
        window.toggleTreasury = function() {
            const hero = window.currentHero;
            if (!hero) {
                alert("Няма активен герой!");
                return;
            }
            const inventory = hero.inventory || [];
            const oldModal = document.getElementById('treasury-custom-modal');
            if (oldModal) oldModal.remove();
            
            const modal = document.createElement('div');
            modal.id = 'treasury-custom-modal';
            modal.className = 'modal-overlay';
            
            let itemsHtml = '';
            if (inventory.length === 0) {
                itemsHtml = '<div style="text-align:center; padding:20px; color:#aaa;">Все още нямате артефакти. Победете в битки, за да ги намерите.</div>';
            } else {
                itemsHtml = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px;">';
                inventory.forEach(item => {
                    itemsHtml += `
                        <div style="background:rgba(20,20,30,0.6); border:1px solid #d4af37; border-radius:12px; padding:8px; text-align:center;">
                            <div style="font-size:32px;">${item.icon || '🏺'}</div>
                            <div style="font-size:12px; color:#ffd700;">${item.name || 'Артефакт'}</div>
                            <div style="font-size:10px; color:#aaa;">${item.era || 'Неизвестна епоха'}</div>
                            <div style="font-size:9px; color:#88ff88;">+${item.bonus?.heroPower || 0} сила</div>
                        </div>
                    `;
                });
                itemsHtml += '</div>';
            }
            
            modal.innerHTML = `
                <div class="modal-content">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d4af37; padding-bottom: 10px; margin-bottom: 15px;">
                        <h2 style="color: #ffd700; margin:0;">🏺 Родова съкровищница</h2>
                        <button id="closeTreasuryBtn" style="background:rgba(255,80,80,0.2); border:none; color:#ff8888; font-size:24px; cursor:pointer; width:36px; height:36px; border-radius:50%;">✕</button>
                    </div>
                    ${itemsHtml}
                    <div style="text-align: center; margin-top: 20px;">
                        <button id="closeTreasuryFooter" style="background:#2c2c3a; border:1px solid #d4af37; color:#ffd700; padding:8px 20px; border-radius:30px; cursor:pointer;">Затвори</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            const close = () => modal.remove();
            modal.querySelector('#closeTreasuryBtn')?.addEventListener('click', close);
            modal.querySelector('#closeTreasuryFooter')?.addEventListener('click', close);
            modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
        };
    }
    
    console.log("✅ Резервните функции за карта и съкровищница са активни.");
})();
</script>

<!-- ПРЕМАХВАНЕ НА ПЛАВАЩ ПАНЕЛ -->
<script>
(function() {
    function removeFloatingPanel() {
        const panel = document.getElementById('autonomous-event-log');
        if (panel) panel.remove();
    }
    removeFloatingPanel();
    setInterval(removeFloatingPanel, 500);
})();
</script>

</body>
</html>
