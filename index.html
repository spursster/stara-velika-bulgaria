<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #eee; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden; }
        .top-btn { background: #1a1a1a; color: #d4af37; border: 1px solid #333; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 18px; transition: 0.3s; }
        .top-btn:hover { background: #d4af37; color: black; border-color: #d4af37; }
        .next-turn-btn { background: #d4af37; color: black; font-weight: bold; }
        #action-bar { background: #0a0a0a; border-bottom: 1px solid #333; display: flex; justify-content: space-around; align-items: center; height: 50px; padding: 0 10px; }
        #new-item-badge { position: absolute; top: -5px; right: -8px; background: #ff4d4d; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; font-weight: bold; border: 1px solid white; }
    </style>
</head>
<body>

    <!-- ГЛАВЕН ХЕДЪР -->
    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37;">
            <div id="current-time-info" style="font-size: 14px;">🌱 Пролет, 480 пр.н.е.</div>
            <div style="font-size: 9px; letter-spacing: 1px; opacity: 0.7;">АНТИЧНОСТ</div>
        </div>
        
        <div id="main-controls" style="display: flex; gap: 8px;">
            <button class="top-btn next-turn-btn" onclick="window.advanceTurn()" title="Следващ ход (⏳)">⏳</button>
            <button class="top-btn" onclick="window.startBattle()" title="Битка (⚔️)">⚔️</button>
            <button class="top-btn" onclick="window.openMarriageMenu()" title="Династичен брак (💍)">💍</button>
        </div>

        <div style="display: flex; align-items: center; gap: 15px; font-family: 'Cinzel', serif;">
            <div title="Злато">💰 <span id="gold-amount" style="color: #ffd700;">750</span></div>
            <button onclick="window.toggleFullScreen()" class="top-btn" style="padding: 5px 10px;">⛶</button>
        </div>
    </header>

    <!-- НОВА ХОРИЗОНТАЛНА ЛЕНТА (ACTION BAR) -->
    <div id="action-bar">
        <button class="top-btn" onclick="window.buyUnits()" title="Обучение на воини" style="font-size: 14px; border: none; background: transparent; color: #d4af37;">🛡️ ОБУЧЕНИЕ</button>
        
        <div style="display: flex; gap: 20px; font-size: 14px; font-family: 'Cinzel', serif;">
            <div title="Лична мощ">⚔️ МОЩ: <span id="hero-power-val" style="color: #ff4d4d;">50</span></div>
            <div title="Численост на войските">🛡️ ВОЙСКА: <span id="army-val">100</span></div>
        </div>

        <div style="position: relative; cursor: pointer; padding: 5px;" onclick="window.toggleTreasury()">
            <span style="font-size: 22px;" title="Съкровищница">🏺</span>
            <div id="new-item-badge" style="display: none;">0</div>
        </div>
    </div>

    <!-- ОСНОВНА ЧАСТ -->
    <main id="game-container" style="display: flex; height: calc(100vh - 110px);">
        <aside id="left-sidebar" style="width: 250px; background: #0a0a0a; border-right: 1px solid #333; padding: 15px; overflow-y: auto;">
            <div id="provinces-list"></div>
        </aside>

        <section id="game-main-area" style="flex: 1; padding: 20px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); overflow-y: auto; position: relative;">
            <div id="events-center"></div>
            
            <!-- МОДАЛ ЗА СЪКРОВИЩНИЦА -->
            <div id="treasury-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; padding: 30px; border: 1px solid #d4af37; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px;">
                    <h2 style="font-family: 'Cinzel', serif; color: #d4af37; margin: 0;">🏺 КРАЛСКА СЪКРОВИЩНИЦА</h2>
                    <button onclick="window.toggleTreasury()" style="background: none; border: none; color: #d4af37; font-size: 24px; cursor: pointer;">✕</button>
                </div>
                <div id="treasury-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 20px; margin-top: 30px;"></div>
            </div>
        </section>
    </main>

    <!-- ВКЛЮЧВАНЕ НА МОДУЛИ -->
    <script src="database.js"></script>
    <script src="mechanics.js"></script>
    <script src="time.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
</body>
</html>
