<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стара Велика България - CK Heroes</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <header>
   <h1>⚔️ Стара Велика България (632)</h1>
    <button id="fs" class="fs-btn" title="Цял екран">⛶</button>
    <div class="resources"> 
      <span>💰 <b id="gold">0</b></span>
      <span>🙏 <b id="faith">0</b></span>
      <span>📅 Година: <b id="year">632</b></span>
    </div>
  </header>
  <nav>
    <button data-tab="pantheon" class="active">Пантеон</button>
    <button data-tab="heroes">Герои</button>
    <button data-tab="equip">Екипировка</button>
    <button data-tab="dynasty">Династии</button>
    <button data-tab="arch">Археология</button>
  </nav>
  <main id="content"></main>
</div>
<script type="module" src="js/main.js"></script> 
  
<script type="module" src="js/main.js?v=3"></script>
  <script>
async function showDynasties() {
  const el = document.getElementById('dynasties');
  if(!el) return;
  const data = await fetch('./data/dynasties.json?v='+Date.now()).then(r=>r.json());
  let html = '<h2>Български Династии</h2>';
  for(const key in data){
    const d = data[key];
    html += `<div class="card"><h3>${d.name}</h3><p>Родоначалник: ${d.founder}</p><p>${d.rulers.map(r=>r.name+' ('+r.years+')').join(', ')}</p></div>`;
  }
  el.innerHTML = html;
}

// направи бутона да работи
document.addEventListener('DOMContentLoaded', () => {
  showDynasties();
  const btn = document.querySelector('[data-tab="dynasties"]');
  if(btn){
    btn.onclick = () => {
      document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('content').style.display='none';
      const dyn = document.getElementById('dynasties');
      document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
      dyn.style.display='block';
    };
  }
});
</script>
