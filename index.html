<!DOCTYPE html>
<html lang="bg">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 📱 ОПТИМИЗИРАНА ДОЛНА ЛЕНТА ЗА 6 БУТОНА – БЕЗ ИЗЛИЗАНЕ ОТ ЕКРАНА 📱 */
        #bottom-controls {
            position: fixed !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 70px !important;
            background: rgba(17, 17, 17, 0.85) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border-top: 2px solid #d4af37 !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            z-index: 9999 !important;
            padding: 0 4px !important;
            box-sizing: border-box !important;
        }

        /* АДАПТИВНИ И СИМЕТРИЧНИ БУТОНИ – СВИВАТ СЕ АВТОМАТИЧНО СПРЯМО ТЕЛЕФОНА */
        .icon-btn {
            background: rgba(20, 20, 20, 0.6) !important;
            border: 1px solid #d4af37 !important;
            color: #d4af37 !important;
            font-size: 20px !important;
            border-radius: 6px !important;
            cursor: pointer !important;
            flex: 1 !important;
            min-width: 0 !important;
            margin: 0 2px !important;
            height: 48px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            position: relative !important;
            transition: background 0.2s, transform 0.1s !important;
            box-sizing: border-box !important;
        }

        @media (max-width: 360px) {
            .icon-btn {
                font-size: 16px !important;
                margin: 0 1px !important;
            }
        }

        .icon-btn:hover {
            background: rgba(212, 175, 55, 0.2) !important;
        }

        .icon-btn:active {
            transform: scale(0.95) !important;
        }

        /* Подравняване на значката с числото върху иконката */
        .mission-badge, #expedition-badge {
            position: absolute !important;
            top: 1px !important;
            right: 1px !important;
            background: #ff4d4d !important;
            color: white !important;
            font-size: 9px !important;
            font-weight: bold !important;
            border-radius: 50% !important;
            padding: 1px 4px !important;
            line-height: 1 !important;
        }

        /* КОРЕКЦИЯ НА ОСНОВНИЯ КОНТЕЙНЕР ЗА МОБИЛНИ */
        #game-container {
            height: calc(100vh - 130px) !important;
            overflow: hidden !important;
            display: flex !important;
            margin-bottom: 70px !important;
        }

        @media (max-width: 768px) {
            #left-sidebar {
                width: 35%;
                font-size: 0.8em;
            }
            #game-main-area {
                width: 65%;
            }
        }
    </style>
</head>
<body>
    <div id="battle-screen"></div>

    <div id="event-modal" style="display: none;"></div>

    <header id="top-bar" style="background: transparent; border-bottom: none; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        <div id="time-container">
            <div id="current-time-info" style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 13px;">Зареждане...</div>
            <div id="era-display" style="font-family: 'Cinzel', serif; font-size: 9px; color: #d4af37; opacity: 0.6; letter-spacing: 1px; text-align: center;">АНТИЧНОСТ</div>
        </div>
        
        <div id="dynasty-badge" style="text-align: center;">
            <div id="current-clan-name" style="font-family: 'Cinzel'; color: #fff; font-size: 14px; text-shadow: 0 0 5px #d4af37;">ДИНАСТИЯ</div>
            <div id="current-ruler-name" style="font-size: 10px; color: #aaa;">Владетел</div>
        </div>

        <div style="font-family: 'Cinzel', serif; font-size: 14px; color: #ffd700;">
            💰 <span id="stat-gold">1500</span>
        </div>
    </header>

    <div id="action-bar" style="background: rgba(10,10,10,0.9); border-bottom: 1px solid #333; display: flex; justify-content: center; align-items: center; height: 80px; gap: 15px; display: none;">
    </div>

    <main id="game-container">
        <aside id="left-sidebar">
            <div id="provinces-list" style="padding: 10px;">
                <h3 style="font-family:'Cinzel'; font-size:12px; color:#d4af37; border-bottom:1px solid #333; padding-bottom:5px;">ВЛАДЕНИЯ</h3>
            </div>
            
            <div style="padding: 10px; display: flex; flex-direction: column; gap: 10px;">
                <div style="font-family: 'Cinzel'; font-size: 11px; color: #ff4d4d;">⚔️ МОЩ: <span id="stat-power">150</span></div>
                <div style="font-family: 'Cinzel'; font-size: 11px; color: #eee;">🛡️ АРМИЯ: <span id="stat-army">500</span></div>
                
                <div id="treasury-trigger" style="cursor: pointer; background: rgba(17, 17, 17, 0.6); padding: 10px; border-radius: 4px; border: 1px solid #d4af37; text-align: center;" onclick="window.toggleTreasury()">
                    <span style="font-size: 20px;">🏺</span>
                    <span id="new-item-badge" style="display: none; background: #ff4d4d; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; margin-left: 5px;">0</span>
                </div>
            </div>

            <div id="history-log-container" style="margin-top: 20px; padding: 10px; border-top: 1px solid #333;">
                <h4 style="font-family: 'Cinzel'; color: #d4af37; font-size: 11px; margin-bottom: 10px;">ЛЕТОПИС</h4>
                <div id="history-log" style="font-size: 10px; color: #aaa; max-height: 200px; overflow-y: auto; line-height: 1.4;">
                </div>
            </div>
        </aside>

        <section id="game-main-area" style="position: relative;">
            <div id="barracks-container" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,10,0.95); z-index: 50; padding: 20px; overflow-y: auto;"></div>

            <div id="central-display" style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.15;">
                 <img id="dynasty-shield" src="assets/icons/clans/default.png" style="width: 200px; filter: drop-shadow(0 0 10px #000);" onerror="this.style.display='none'">
                 <h1 style="font-family: 'Cinzel'; color: #d4af37; margin-top: 15px; font-size: 22px; letter-spacing: 4px; text-align: center;">ВЕЛИКА БЪЛГАРИЯ</h1>
            </div>
            
            <div id="treasury-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; padding: 25px; border: 2px solid #7b1a1a;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; padding-bottom: 10px;">
                    <h2 style="font-family: 'Cinzel'; color: #d4af37; font-size: 18px; margin:0;">🏺 РОДОВА СЪКРОВИЩНИЦА</h2>
                    <button onclick="window.toggleTreasury()" style="background:none; border:none; color:#d4af37; font-size:24px; cursor:pointer;">✕</button>
                </div>
                <div id="treasury-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin-top: 20px;"></div>
            </div>
        </section>
    </main>

    <div id="bottom-controls">
        <button class="icon-btn" onclick="window.openRegionsMap()">🗺️</button>
        <button class="icon-btn" onclick="window.buyUnits()">🏹</button>
        <button class="icon-btn" id="btn-battle" onclick="window.startBattle()">⚔️</button>
        <button class="icon-btn" id="btn-expeditions" onclick="window.openExpeditionsMenu()" title="Експедиции">
            🧭
            <div id="expedition-badge" class="mission-badge">3</div>
        </button>
        <button class="icon-btn" id="btn-marriage" onclick="window.openMarriageMenu()">👑</button>
        <button class="icon-btn" onclick="window.openInventory()">🎒</button>
    </div>

    <script src="mechanics.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="database.js"></script>
    <script src="items.js"></script> 
    <script src="expeditions.js"></script> 
    <script src="battle.js"></script>
    <script src="logic.js"></script>
    <script src="time.js"></script>
    <script src="ui.js"></script>
</body>
</html>
