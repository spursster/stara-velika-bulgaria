<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #050505; color: #eee; font-family: 'Montserrat', sans-serif; margin: 0; overflow: hidden;">

    <!-- ГОРНА ЛЕНТА -->
    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37;">
            <span id="current-time-info">🌱 Пролет, 480 пр.н.е. | Античност</span>
        </div>
        
        <div id="resources" style="display: flex; gap: 20px;">
            <div title="Злато">💰 <span id="gold-amount">750</span></div>
            <div title="Армия">⚔️ <span id="army-total">100</span></div>
        </div>

        <div id="controls-right" style="display: flex; align-items: center; gap: 15px;">
            <!-- БУТОН ЗА ЦЯЛ ЕКРАН -->
            <button onclick="window.toggleFullScreen()" style="background: none; border: 1px solid #333; color: #d4af37; cursor: pointer; padding: 5px 10px; border-radius: 3px; font-size: 14px;" title="Цял екран">
                ⛶
            </button>
            
            <div id="language-selector">
                <button onclick="window.setLanguage('BG')" style="background:none; border:none; cursor:pointer;">🇧🇬</button>
                <button onclick="window.setLanguage('US')" style="background:none; border:none; cursor:pointer;">🇺🇸</button>
            </div>
        </div>
    </header>

    <main id="game-container" style="display: flex; height: calc(100vh - 55px);">
        
        <!-- ЛЯВ ПАНЕЛ: Провинции -->
        <aside id="left-sidebar" style="width: 250px; background: #0a0a0a; border-right: 1px solid #333; padding: 15px; overflow-y: auto;">
            <h3 class="section-title" style="font-family: 'Cinzel', serif; color: #d4af37;">ВЛАДЕНИЯ</h3>
            <div id="provinces-list"></div>
        </aside>

        <!-- ЦЕНТРАЛНА ЗОНА: Хроника -->
        <section id="game-main-area" style="flex: 1; padding: 20px; display: flex; flex-direction: column; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);">
            <h3 class="section-title" style="font-family: 'Cinzel', serif; text-align: center; color: #d4af37;">📜 ИМПЕРСКА ХРОНИКА</h3>
            <div id="events-center" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
        </section>

        <!-- ДЕСЕН ПАНЕЛ: Управление и Казарма -->
        <aside id="right-sidebar" style="width: 320px; background: #0a0a0a; border-left: 1px solid #333; padding: 15px; overflow-y: auto;">
            <div id="character-panel"></div>
        </aside>

    </main>

    <!-- СКРИПТОВЕ -->
    <script src="database.js"></script>
    <script src="mechanics.js"></script>
    <script src="time.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
</body>
</html>
