<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стара Велика България</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:sans-serif;margin:0;padding:20px}
h1{color:#fbbf24;text-align:center}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:8px;border-left:4px solid #fbbf24}
h3{margin:0 0 5px;color:#fbbf24}
</style>
</head>
<body>
<h1>Стара Велика България</h1>
<div id="game">Играта зарежда...</div>
<div id="dynasties"></div>

<script>
// ЗАРЕЖДАНЕ НА ДИНАСТИИТЕ - работи 100%
fetch('./data/dynasties.json?v='+Date.now())
 .then(r=>r.json())
 .then(data=>{
    let html = '<h2>Български Династии ('+Object.keys(data).length+')</h2>';
    for(const k in data){
      const d = data[k];
      html += '<div class="card"><h3>'+d.name+'</h3>';
      html += '<p><b>Родоначалник:</b> '+d.founder+'</p>';
      html += '<p>'+d.rulers.map(x=>x.name+' ('+x.years+')').join(', ')+'</p></div>';
    }
    document.getElementById('dynasties').innerHTML = html;
  })
 .catch(e=>{document.getElementById('dynasties').innerHTML='Грешка: '+e.message});
</script>
</body>
</html>
