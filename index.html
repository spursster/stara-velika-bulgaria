<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="battle-screen"></div>

    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37;">
            <div id="current-time-info" style="font-size: 13px;">Зареждане...</div>
            <div id="era-display" style="font-size: 9px; opacity: 0.6; letter-spacing: 1px;">АНТИЧНОСТ</div>
        </div>
        
        <div id="dynasty-badge" style="text-align: center;">
            <div id="current-clan-name" style="font-family: 'Cinzel'; color: #fff; font-size: 14px; text-shadow: 0 0 5px #d4af37;">ДИНАСТИЯ</div>
            <div id="current-ruler-name" style="font-size: 10px; color: #aaa;">Владетел</div>
        </div>

        <div style="font-family: 'Cinzel', serif; font-size: 14px; color: #ffd700;">
            💰 <span id="gold-amount">1500</span>
        </div>
    </header>

   <div id="action-bar" style="background: rgba(10,10,10,0.9); border-bottom: 1px solid #333; display: flex; justify-content: center; align-items: center; height: 80px; gap: 15px;">
    
    <div class="leader-wrapper">
        <div class="leader-icon mini"><img src="assets/icons/leaders/attila.png" onerror="this.src='https://img.icons8.com/ios-filled/50/d4af37/shield.png'"></div>
        <span class="leader-age">45г.</span>
    </div>
    <div class="leader-wrapper">
        <div class="leader-icon mini"><img src="assets/icons/leaders/alexander.png" onerror="this.src='https://img.icons8.com/ios-filled/50/d4af37/sword.png'"></div>
        <span class="leader-age">32г.</span>
    </div>

    <div id="current-ruler-portal" style="display: flex; flex-direction: column; align-items: center; margin: 0 10px;">
        <div style="position: relative;">
            <img id="ruler-portrait" src="assets/icons/leaders/kubrat.png" class="main-ruler-img small" onerror="this.src='https://img.icons8.com/ios-filled/100/d4af37/king.png'">
            <span class="main-ruler-age">60г.</span>
        </div>
        <div id="ruler-name-tag" style="font-size: 9px; padding: 1px 5px;">КАН КУБРАТ</div>
    </div>

    <div class="leader-wrapper">
        <div class="leader-icon mini"><img src="assets/icons/leaders/simeon.png" onerror="this.src='https://img.icons8.com/ios-filled/50/d4af37/crown.png'"></div>
        <span class="leader-age">54г.</span>
    </div>
    <div class="leader-wrapper">
        <div class="leader-icon mini"><img src="assets/icons/leaders/vlad.png" onerror="this.src='https://img.icons8.com/ios-filled/50/d4af37/medieval-weapon.png'"></div>
        <span class="leader-age">38г.</span>
    </div>
</div>

        <div class="leader-icon" title="Симеон Велики"><img src="assets/icons/leaders/simeon.png" class="mini-leader" onerror="this.src='https://img.icons8.com/ios-filled/50/d4af37/crown.png'"></div>
        <div class="leader-icon" title="Влад Цепеш"><img src="assets/icons/leaders/vlad.png" class="mini-leader" onerror="this.src='https://img.icons8.com/ios-filled/50/d4af37/medieval-weapon.png'"></div>
    </div>

    <main id="game-container">
        <aside id="left-sidebar">
            <div id="provinces-list" style="padding: 10px;">
                <h3 style="font-family:'Cinzel'; font-size:12px; color:#d4af37; border-bottom:1px solid #333; padding-bottom:5px;">ВЛАДЕНИЯ</h3>
            </div>
            
            <div style="padding: 10px; display: flex; flex-direction: column; gap: 10px;">
                <div style="font-family: 'Cinzel'; font-size: 11px; color: #ff4d4d;">⚔️ МОЩ: <span id="hero-power-val">150</span></div>
                <div style="font-family: 'Cinzel'; font-size: 11px; color: #eee;">🛡️ АРМИЯ: <span id="army-val">500</span></div>
                <div id="treasury-trigger" style="cursor: pointer; background: #111; padding: 10px; border-radius: 4px; border: 1px solid #d4af37; text-align: center;" onclick="window.toggleTreasury()">
                    <span style="font-size: 20px;">🏺</span>
                    <span id="new-item-badge" style="display: none; background: #ff4d4d; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; margin-left: 5px;">0</span>
                </div>
            </div>
        </aside>

        <section id="game-main-area" style="position: relative;">
            <div id="central-display" style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.15;">
                 <img id="dynasty-shield" src="assets/icons/clans/default.png" style="width: 200px; filter: drop-shadow(0 0 10px #000);" onerror="this.style.display='none'">
                 <h1 style="font-family: 'Cinzel'; color: #d4af37; margin-top: 15px; font-size: 22px; letter-spacing: 4px;">ВЕЛИКА БЪЛГАРИЯ</h1>
            </div>
            
            <div id="treasury-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; padding: 25px; border: 2px solid #7b1a1a;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; padding-bottom: 10px;">
                    <h2 style="font-family: 'Cinzel'; color: #d4af37; font-size: 18px; margin:0;">🏺 РОДОВА СЪКРОВИЩНИЦА</h2>
                    <button onclick="window.toggleTreasury()" style="background:none; border:none; color:#d4af37; font-size:24px; cursor:pointer;">✕</button>
                </div>
                <div id="treasury-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin-top: 20px;"></div>
            </div>
        </section>
    </main>

    <footer id="bottom-controls">
        <button class="icon-btn" onclick="window.advanceTurn()" title="Следващ ход">⏳</button>
        <button class="icon-btn" onclick="window.startBattle()" title="Битка">⚔️</button>
        <button class="icon-btn" onclick="window.openMarriageMenu()" title="Брак">💍</button>
        <button class="icon-btn" onclick="window.buyUnits()" title="Обучение">🛡️</button>
    </footer>

    <script src="database.js"></script>
    <script src="mechanics.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    <script src="time.js"></script>
    <script src="ui.js"></script>
    <script src="logic.js"></script>
    
</body>
</html>
