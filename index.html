<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велика България - Стратегия</title>
    <!-- Използваме ./ за сигурно намиране на файла в същата папка -->
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Резервен стил, ако style.css пак даде 404 */
        body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; }
        #game-container { display: flex; height: 100vh; }
        #main-view { flex: 2; padding: 20px; border-right: 2px solid #444; }
        #character-panel { flex: 1; padding: 20px; background: #262626; overflow-y: auto; }
        #world-map { height: 300px; background: #000; border: 1px solid #d4af37; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        #event-log { height: 150px; background: #111; padding: 10px; overflow-y: auto; border: 1px solid #333; font-size: 13px; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="main-view">
            <header>
                <h1 style="color: #d4af37; margin: 0;">💡 Велика България</h1>
                <p id="game-date" style="font-weight: bold;">Година: 480 пр.н.е.</p>
            </header>

            <div id="world-map">КАРТА</div>

            <div id="event-log">
                <p>ℹ️ "Добре дошли, Владетелю. Твоята династия започва тук."</p>
            </div>
        </div>

        <aside id="character-panel">
            <p>Зареждане на летописите...</p>
        </aside>
    </div>

    <!-- Редът на скриптовете е КРИТИЧЕН -->
    <script src="world_data.js"></script>
    <script src="database.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
    <script src="time.js"></script>
    <script src="battle.js"></script>
    <script src="diplomacy.js"></script>

    <script>
        // Стартиране на играта
        window.onload = function() {
            console.log("Играта стартира...");
            if (typeof Character === 'function') {
                window.currentHero = new Character("Терес", "Одриси");
                if (typeof updateCharacterUI === 'function') {
                    window.updateCharacterUI(window.currentHero);
                    console.log("Интерфейсът е зареден успешно.");
                } else {
                    console.error("Грешка: updateCharacterUI не е намерена!");
                }
            } else {
                console.error("Грешка: Класът Character не е зареден!");
            }
        };
    </script>
</body>
</html>
