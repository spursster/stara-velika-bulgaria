<!-- ПОД ХЕДЪРА ДОБАВЯМЕ ТАЗИ ЛЕНТА -->
<div id="action-bar" style="background: #0a0a0a; border-bottom: 1px solid #333; display: flex; justify-content: space-around; align-items: center; height: 45px; padding: 0 10px;">
    
    <!-- Обучение -->
    <button class="top-btn" onclick="window.buyUnits()" title="Обучение на воини" style="font-size: 16px; border: none; background: transparent;">🛡️+</button>

    <!-- Индикатори -->
    <div style="display: flex; gap: 15px; font-size: 13px; font-family: 'Cinzel', serif;">
        <div title="Лична мощ">⚔️ <span id="hero-power-val" style="color: #ff4d4d;">50</span></div>
        <div title="Численост на войските">🛡️ <span id="army-val">100</span></div>
    </div>

    <!-- Съкровищница с индикатор -->
    <div style="position: relative; cursor: pointer;" onclick="window.toggleTreasury()">
        <span style="font-size: 20px;">🏺</span>
        <div id="new-item-badge" style="display: none; position: absolute; top: -5px; right: -8px; background: #ff4d4d; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; font-weight: bold; border: 1px solid white;">0</div>
    </div>
</div>

<!-- Промяна в main: Премахваме десния панел и правим централния широк -->
<main id="game-container" style="display: flex; height: calc(100vh - 105px);">
    <aside id="left-sidebar" style="width: 250px; background: #0a0a0a; border-right: 1px solid #333; padding: 15px; overflow-y: auto;">
        <div id="provinces-list"></div>
    </aside>

    <section id="game-main-area" style="flex: 1; padding: 20px; background: radial-gradient(circle, #1a1a1a 0%, #050505 100%); overflow-y: auto; position: relative;">
        <div id="events-center"></div>
        
        <!-- МОДАЛЕН ПРОЗОРЕЦ ЗА СЪКРОВИЩНИЦА (Скрит по подразбиране) -->
        <div id="treasury-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; padding: 20px; border: 1px solid #d4af37;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-family: 'Cinzel', serif; color: #d4af37;">СЪКРОВИЩНИЦА</h2>
                <button onclick="window.toggleTreasury()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">✕</button>
            </div>
            <div id="treasury-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; margin-top: 20px;"></div>
        </div>
    </section>
</main>
