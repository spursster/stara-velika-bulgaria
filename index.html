<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Bulgaria</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main-layout">
        <!-- Ляв страничен панел за региони -->
        <aside id="regions-sidebar">
            <h3 class="section-title">🗺️ ВЛАДЕНИЯ</h3>
            <div id="provinces-list" class="provinces-grid">
                <!-- Тук ui.js ще вмъква регионите -->
            </div>
        </aside>

        <!-- Централен контейнер на играта -->
        <div id="game-container">
            <h1 class="main-title">EPIC BULGARIA</h1>
            
            <div class="top-bar">
                <span id="year-display">📅 -479 г. г.</span>
                <span id="gold-display">🪙 750</span>
            </div>

            <div id="event-log"></div>

            <div class="language-switcher">
                <span class="flag" onclick="window.setLanguage('bg')">BG</span>
                <span class="flag" onclick="window.setLanguage('en')">US</span>
                <span class="flag" onclick="window.setLanguage('ru')">RU</span>
            </div>

            <div id="character-panel">
                <!-- Тук ui.js ще вмъква Кан и бутоните -->
            </div>
        </div>
    </div>

    <!-- Скриптовете остават същите, заредени в правилния ред -->
    <script src="logic.js"></script>
    <script src="world_data.js"></script>
    <script src="database.js"></script>
    <script src="regions.js"></script>
    <script src="items.js"></script>
    <script src="mechanics.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="events.js"></script>
    <script src="battle.js"></script>
    <script src="diplomacy.js"></script>
    <script src="time.js"></script>
    <script src="ui.js"></script>
</body>
</html>
