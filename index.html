<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magna Bulgaria v40 - Lore Edition</title>
<style>
:root{
  --bg:#0a0a0a;
  --panel:#141008;
  --gold:#d4af37;
  --gold-dark:#8c7322;
  --text:#e9dbb8;
  --text-dim:#bfae84;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif}
body{background: radial-gradient(1200px 800px at 50% -200px,#1b140a 0%,#0a0a0a 60%)}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(180deg,#1a1308,#0e0a05);border-bottom:3px solid var(--gold);box-shadow:0 4px 12px #000}
.tb-info{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:15px}
.tb-info strong{color:var(--gold);text-shadow:0 0 8px rgba(212,175,55,.35);font-size:17px;letter-spacing:.5px}
.sep{opacity:.4}
.tb-actions button{margin-left:8px}
button{background:linear-gradient(#2a210f,#1a1408);color:var(--text);border:1px solid var(--gold);border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:14px;transition:all .2s}
button:hover{background:linear-gradient(#3a2f18,#231a0b);box-shadow:0 0 10px rgba(212,175,55,.4);transform:translateY(-1px)}
button:active{transform:translateY(0)}button:disabled{opacity:.5;cursor:not-allowed}
.layout{display:grid;grid-template-columns:340px 1fr 340px;gap:14px;padding:14px;max-width:1600px;margin:0 auto}
.panel{background:radial-gradient(ellipse at top,#1c150b 0%,#0f0a05 85%);border:2px solid var(--gold);border-radius:10px;padding:12px;box-shadow:inset 0 0 24px rgba(212,175,55,.08),0 6px 18px rgba(0,0,0,.7);position:relative}
.panel::before{content:'';position:absolute;inset:0;border-radius:8px;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(212,175,55,.18)}
.panel h2,.panel h3{margin:0 0 10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:15px;border-bottom:1px solid rgba(212,175,55,.3);padding-bottom:6px}
.scroll{max-height:420px;overflow-y:auto;padding-right:6px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-track{background:#0a0703}.scroll::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:4px}
.army{background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.25);border-radius:8px;padding:8px;margin-bottom:9px}
.army h4{margin:0 0 4px;color:var(--gold);font-size:15px}
.army .stats{font-size:13px;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
.army .leader{margin:5px 0 6px;font-size:13px}
.army button{width:100%;margin-top:4px;font-size:12px;padding:5px}
.nation{border:1px solid rgba(212,175,55,.2);border-radius:6px;padding:8px;margin-bottom:7px;background:rgba(0,0,0,.22)}
.nation.highlight{border:2px solid var(--gold);background:linear-gradient(180deg,rgba(212,175,55,.16),rgba(0,0,0,.2));box-shadow:0 0 14px rgba(212,175,55,.28)}
.nation .title{font-weight:bold;color:var(--text)}
.nation .desc{font-size:12px;color:var(--text-dim);font-style:italic;margin-top:2px}
.nation .meta{display:flex;justify-content:space-between;font-size:12px;margin-top:5px;color:var(--gold)}
.ritual{text-align:center;padding:22px 12px}
.summon-btn{font-size:19px;padding:14px 24px;background:radial-gradient(#3a2a12,#1f1608);border:2px solid var(--gold);box-shadow:0 0 22px rgba(212,175,55,.22);margin:12px 0;letter-spacing:.5px}
.summon-btn:hover{box-shadow:0 0 32px rgba(212,175,55,.5)}
.cost{color:var(--text-dim);font-size:13px}.last{margin-top:10px;font-size:14px;min-height:22px;color:var(--gold)}
.warrior{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px dashed rgba(212,175,55,.15)}
.warrior.locked{opacity:.42;filter:grayscale(1)}
.warrior .portrait{width:38px;height:38px;border-radius:50%;background:#000;border:1px solid var(--gold-dark);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.warrior.unlocked .portrait{background:radial-gradient(#3a2a12,#1a1206);border-color:var(--gold);box-shadow:0 0 8px rgba(212,175,55,.3)}
.warrior.alexander.unlocked .portrait{box-shadow:0 0 16px gold,0 0 6px var(--gold)}
.warrior .name{font-weight:bold;color:var(--text);font-size:14px}
.warrior .bonus{font-size:11px;color:var(--text-dim)}
.god-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(212,175,55,.1);font-size:13px}
.god-item.locked{opacity:.34}
.god-item .gname{color:var(--text)}.god-item .gbonus{color:var(--gold);font-size:12px}
.dynasty{margin:14px auto;max-width:1600px}
.dyn-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wives{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.wives button.active{background:var(--gold);color:#000;font-weight:bold;box-shadow:0 0 12px rgba(212,175,55,.5)}
.children{display:flex;gap:16px;margin-top:8px}
.child{text-align:center;background:rgba(0,0,0,.3);border:1px solid rgba(212,175,55,.22);border-radius:8px;padding:8px 12px;min-width:84px}
.child span{font-size:26px;display:block}.child small{color:var(--text-dim);font-size:12px}
.bonus-text{font-size:12px;color:var(--gold);margin-top:6px;min-height:16px}
.garrison-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(212,175,55,.15);font-size:13px}
.garrison-item button{font-size:11px;padding:3px 8px}
#toast-container{position:fixed;top:72px;right:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:linear-gradient(#1c150b,#0f0a05);border:1px solid var(--gold);border-left:4px solid var(--gold);color:var(--text);padding:10px 14px;border-radius:6px;box-shadow:0 6px 18px #000;min-width:260px;max-width:320px;animation:slideIn .3s ease;font-size:14px}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.dyn-grid{grid-template-columns:1fr}}
</style>
</head>

</main>

</footer>

let state = loadState() || JSON.parse(JSON.stringify(defaultState));

function saveState(){localStorage.setItem('mb_v40_lore',JSON.stringify(state))}
function loadState(){try{const s=localStorage.getItem('mb_v40_lore');return s?JSON.parse(s):null}catch(e){return null}}

function toast(msg){const c=document.getElementById('toast-container');const d=document.createElement('div');d.className='toast';d.textContent=msg;c.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(40px)';setTimeout(()=>d.remove(),300)},3800)}

function applyTranslations(){document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(T[state.lang][k]) el.textContent=T[state.lang][k]});document.getElementById('btnLang').textContent=state.lang==='bg'?'EN':'BG'}

function updateTop(){
 document.getElementById('goldStat').textContent = `💰 ${state.gold.toLocaleString()}`;
 document.getElementById('yearStat').textContent = state.lang==='bg' ? `Год. ${state.year}` : `Year ${state.year}`;
}

function renderArmies(){
 const el=document.getElementById('armiesList');el.innerHTML='';
 ['left','center','right'].forEach(k=>{
  const a=state.armies[k];
  const w = a.leader ? warriorsPool.find(x=>x.id===a.leader) : null;
  const wo = a.leader ? state.warriors.find(x=>x.id===a.leader) : null;
  const leaderName = w ? (state.lang==='bg'?w.bg:w.en)+(wo?` (+${wo.attack}%)`:'') : T[state.lang].none;
  const name = state.lang==='bg'?a.name_bg:a.name_en;
  el.innerHTML += `<div class="army"><h4>${name}</h4><div class="stats"><span>${T[state.lang].infantry}: ${a.infantry.toLocaleString()}</span><span>${T[state.lang].cavalry}: ${a.cavalry.toLocaleString()}</span></div><div class="leader">${T[state.lang].leader}: <b>${leaderName}</b></div><button onclick="assignLeader('${k}')">${T[state.lang].assign}</button></div>`;
 });
}

function renderNations(){
 const el=document.getElementById('nationsList');el.innerHTML='';
 nations.forEach(n=>{
  const div=document.createElement('div');div.className='nation'+(n.highlight?' highlight':'');
  div.innerHTML=`<div class="title">${state.lang==='bg'?n.name_bg:n.name_en}</div>${n.desc_bg?`<div class="desc">${state.lang==='bg'?n.desc_bg:n.desc_en}</div>`:''}<div class="meta"><span>${T[state.lang].loyalty}: ${n.loyalty}%</span><span>${state.lang==='bg'?n.bonus_bg:n.bonus_en}</span></div>`;
  el.appendChild(div);
 });
}

function renderGarrisons(){
 const el=document.getElementById('garrisonsList');el.innerHTML='';
 Object.entries(state.garrisons).forEach(([city,c])=>{
  const name=city.charAt(0).toUpperCase()+city.slice(1);
  el.innerHTML+=`<div class="garrison-item"><span>${name}: <b>${c}</b></span><button onclick="recruitGarrison('${city}')">${T[state.lang].recruit} (50g)</button></div>`;
 });
}

function renderWarriors(){
 const el=document.getElementById('warriorsList');el.innerHTML='';
 warriorsPool.forEach(w=>{
  const owned=state.warriors.find(o=>o.id===w.id);
  const div=document.createElement('div');div.className='warrior '+(owned?'unlocked':'locked')+(w.id==='alexander'?' alexander':'');
  if(owned && w.desc){div.title=state.lang==='bg'?w.desc.bg:w.desc.en}
  const name=owned?(state.lang==='bg'?w.bg:w.en):'???';
  const atk=owned?owned.attack:w.attack;
  div.innerHTML=`<div class="portrait">${owned?'⚔️':'?'}</div><div class="info"><div class="name">${name}</div><div class="bonus">${owned?`+${atk}% ${T[state.lang].attack} • ${T[state.lang].canKill}`:''}</div></div>`;
  el.appendChild(div);
 });
}

function renderGods(){
 const el=document.getElementById('godsList');el.innerHTML='';
 godsPool.forEach(g=>{
  const owned=state.gods.includes(g.id);
  const div=document.createElement('div');div.className='god-item '+(owned?'':'locked');
  div.innerHTML=`<span class="gname">${owned?(state.lang==='bg'?g.bg:g.en):'???'}</span><span class="gbonus">${owned?g.bonus:''}</span>`;
  el.appendChild(div);
 });
}

function renderLast(){
 const el=document.getElementById('lastSummon');
 if(!state.lastSummon){el.textContent=`${T[state.lang].last}: ${T[state.lang].none}`;return}
 if(state.lastSummon.type==='warrior'){
  const w=warriorsPool.find(x=>x.id===state.lastSummon.id);
  el.textContent=`${T[state.lang].last}: ${T[state.lang].summonedWarrior} - ${state.lang==='bg'?w.bg:w.en}`;
 }else if(state.lastSummon.type==='god'){
  const g=godsPool.find(x=>x.id===state.lastSummon.id);
  el.textContent=`${T[state.lang].last}: ${T[state.lang].summonedGod} - ${state.lang==='bg'?g.bg:g.en}`;
 }else{el.textContent=`${T[state.lang].last}: ${T[state.lang].nothing}`}
}

function renderDynasty(){
 document.querySelectorAll('.wives button').forEach(b=>{b.classList.toggle('active',b.dataset.wife===state.wife)});
 const wb=document.getElementById('wifeBonus');
 if(!state.wife){wb.textContent=''}
 else if(state.wife==='byzantine'){wb.textContent=state.lang==='bg'?'+25 злато/ход, дипломация':'+25 gold/turn, diplomacy'}
 else if(state.wife==='khazar'){wb.textContent=state.lang==='bg'?'+30% конница, съюз':'+30% cavalry, alliance'}
 else {wb.textContent=state.lang==='bg'?'+20% стабилност':'+20% stability'}
}

function updateUI(){applyTranslations();updateTop();renderArmies();renderNations();renderGarrisons();renderWarriors();renderGods();renderLast();renderDynasty();document.getElementById('btnSummon').disabled=state.gold<100}

window.assignLeader=function(key){
 const used=Object.values(state.armies).map(a=>a.leader).filter(Boolean);
 const avail=state.warriors.filter(w=>!used.includes(w.id));
 if(!avail.length){toast(T[state.lang].noWarriors);return}
 avail.sort((a,b)=>b.attack-a.attack);
 state.armies[key].leader=avail[0].id;
 toast(`${state.lang==='bg'?'Назначен':'Assigned'}: ${(state.lang==='bg'?warriorsPool.find(w=>w.id===avail[0].id).bg:warriorsPool.find(w=>w.id===avail[0].id).en)}`);
 saveState();updateUI();
}
window.recruitGarrison=function(city){if(state.gold<50){toast(T[state.lang].noGold);return}state.gold-=50;state.garrisons[city]+=100;saveState();updateUI();toast(`${city} +100`)}

function doRitual(){
 if(state.gold<100){toast(T[state.lang].noGold);return}
 state.gold-=100;
 const r=Math.random()*100;
 if(r<0.8){
  const pool=warriorsPool.filter(w=>!state.warriors.some(s=>s.id===w.id));
  if(pool.length){
   const w=pool[Math.floor(Math.random()*pool.length)];
   state.warriors.push({id:w.id,attack:w.attack});
   state.lastSummon={type:'warrior',id:w.id};
   toast(`★ ${T[state.lang].summonedWarrior}: ${state.lang==='bg'?w.bg:w.en}`);
  }
 }else if(r<2.3){
  const pool=godsPool.filter(g=>!state.gods.includes(g.id));
  if(pool.length){
   const g=pool[Math.floor(Math.random()*pool.length)];
   state.gods.push(g.id);
   state.lastSummon={type:'god',id:g.id};
   toast(`✦ ${T[state.lang].summonedGod}: ${state.lang==='bg'?g.bg:g.en}`);
  }
 }else{
  state.lastSummon={type:'nothing'};
  state.gold+=15;
  toast(T[state.lang].nothing);
 }
 saveState();updateUI();
}

function checkChallenge(){
 if(!state.gods.length||!state.warriors.length) return;
 if(Math.random()>0.3) return;
 const w=state.warriors[Math.floor(Math.random()*state.warriors.length)];
 const gid=state.gods[Math.floor(Math.random()*state.gods.length)];
 const wData=warriorsPool.find(x=>x.id===w.id);
 const gData=godsPool.find(x=>x.id===gid);
 const wName=state.lang==='bg'?wData.bg:wData.en;
 const gName=state.lang==='bg'?gData.bg:gData.en;
 toast(`${wName} ${T[state.lang].challenge} ${gName}`);
 setTimeout(()=>{
  if(Math.random()<0.05){
   state.gods=state.gods.filter(id=>id!==gid);
   w.attack+=5;
   toast(`☠ ${gName} ${T[state.lang].killed} ${wName}! +5%`);
   saveState();updateUI();
  }else{
   toast(`${gName} ${T[state.lang].survived}`);
  }
 },1200);
}

function getIncome(){
 let base=20;
 if(state.wife==='byzantine') base+=25;
 if(state.wife==='khazar') base+=5;
 if(state.wife==='avar') base+=10;
 base+=state.warriors.length*3;
 base+=state.gods.length*2;
 base+=5;
 return base;
}

function nextTurn(){
 state.year++;
 state.gold += 10 + (state.wife==='byzantine'?25:0);
 // grow garrisons slightly
 Object.keys(state.garrisons).forEach(c=>{ state.garrisons[c]+=5 });
 toast(`${T[state.lang].turnDone} ${state.year}: +${10 + (state.wife==='byzantine'?25:0)}g`);
 if(Math.random()<0.25) checkChallenge();
 saveState(); updateUI();
}

function newGame(){
 if(confirm(state.lang==='bg'?'Сигурен ли си? Ще изтриеш прогреса.':'Are you sure? Progress will be lost.')){
  localStorage.removeItem('magna40');
  location.reload();
 }
}

function toggleFS(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}else{document.exitFullscreen()}}

document.getElementById('btnSummon').addEventListener('click',doRitual);
document.getElementById('btnNextTurn').addEventListener('click',nextTurn);
document.getElementById('btnNewGame').addEventListener('click',newGame);
document.getElementById('btnLang').addEventListener('click',()=>{state.lang=state.lang==='bg'?'en':'bg';saveState();updateUI()});
document.getElementById('btnFS').addEventListener('click',toggleFS);
document.querySelectorAll('.wives button').forEach(b=>b.addEventListener('click',()=>{state.wife=b.dataset.wife;saveState();updateUI();toast(state.lang==='bg'?'Брак сключен':'Marriage sealed')}));

// remove auto-income, now manual turns only
setInterval(saveState,10000);

updateUI();
// initial flavor
setTimeout(()=>toast(state.lang==='bg'?'Велика България се пробужда!':'Great Bulgaria awakens!'),800);
})();
</script>
</body>
</html>
