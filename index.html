<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Велика България - Игра</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="battle-screen"></div>

    <header id="top-bar" style="background: #111; border-bottom: 2px solid #d4af37; padding: 0 10px; display: flex; justify-content: space-between; align-items: center; height: 60px;">
        <div id="time-container" style="font-family: 'Cinzel', serif; color: #d4af37;">
            <div id="current-time-info" style="font-size: 13px;">Зареждане...</div>
            <div id="era-display" style="font-size: 9px; opacity: 0.6; letter-spacing: 1px;">АНТИЧНОСТ</div>
        </div>
        
        <div id="dynasty-badge" style="text-align: center;">
            <div id="current-clan-name" style="font-family: 'Cinzel'; color: #fff; font-size: 14px; text-shadow: 0 0 5px #d4af37;">ДИНАСТИЯ</div>
            <div id="current-ruler-name" style="font-size: 10px; color: #aaa;">Владетел</div>
        </div>

        <div style="font-family: 'Cinzel', serif; font-size: 14px; color: #ffd700;">
            💰 <span id="gold-amount">1500</span>
        </div>
    </header>

    <div id="marquee-container" style="background: #000; border-bottom: 1px solid #d4af37; height: 25px; overflow: hidden; display: flex; align-items: center;">
        <div id="marquee-text" class="marquee-style">Мъдростта на старейшините води пътя ни...</div>
    </div>

    <div id="action-bar" style="background: #0a0a0a; border-bottom: 1px solid #333; display: flex; justify-content: space-around; align-items: center; height: 50px;">
        <button onclick="window.buyUnits()" style="background:none; border:none; color:#d4af37; font-family:'Cinzel'; font-size:11px; cursor:pointer; font-weight:bold;">🛡️ ВОЙСКА</button>
        
        <div style="display: flex; gap: 20px; font-size: 12px; font-family: 'Cinzel';">
            <span>⚔️ <span id="hero-power-val" style="color:#ff4d4d;">150</span></span>
            <span>🛡️ <span id="army-val">500</span></span>
        </div>

        <div id="treasury-trigger" style="position: relative; cursor: pointer; background: #111; padding: 5px 10px; border-radius: 4px; border: 1px solid #222;" onclick="window.toggleTreasury()">
            <span style="font-size: 18px;">🏺</span>
            <div id="new-item-badge" style="display: none; position: absolute; top: -5px; right: -8px; background: #ff4d4d; color: white; font-size: 10px; border-radius: 50%; padding: 2px 6px; border: 1px solid white; font-weight: bold;">0</div>
        </div>
    </div>

    <main id="game-container">
        <aside id="left-sidebar">
            <div id="provinces-list" style="padding: 10px;">
                <h3 style="font-family:'Cinzel'; font-size:12px; color:#d4af37; border-bottom:1px solid #333; padding-bottom:5px;">ВЛАДЕНИЯ</h3>
            </div>

            <div id="suggestion-input-block" style="margin-top: 20px; padding: 10px; border-top: 1px dashed #333;">
                <div style="font-size: 9px; color: #d4af37; font-family: 'Cinzel'; margin-bottom: 5px;">СЪВЕТ ДО ВЛАДЕТЕЛЯ:</div>
                <textarea id="player-suggestion-text" placeholder="Сподели своята воля..." 
                    style="width: 100%; height: 60px; background: #000; border: 1px solid #222; color: #eee; font-size: 11px; padding: 8px; box-sizing: border-box; resize: none; font-family: 'Montserrat', sans-serif;"></textarea>
                <button onclick="window.submitSuggestion()" 
                    style="width: 100%; margin-top: 5px; background: #7b1a1a; border: 1px solid #d4af37; color: #fff; font-family: 'Cinzel'; font-size: 10px; cursor: pointer; padding: 8px; font-weight: bold;">
                    ЗАПИШИ В ЛЕТОПИСИТЕ
                </button>
            </div>
        </aside>

        <section id="game-main-area" style="position: relative;">
            <div id="central-display" style="height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.15;">
                 <img id="dynasty-shield" src="assets/icons/clans/default.png" style="width: 220px; filter: drop-shadow(0 0 10px #000);" onerror="this.style.display='none'">
                 <h1 style="font-family: 'Cinzel'; color: #d4af37; margin-top: 20px; font-size: 24px; letter-spacing: 4px;">ВЕЛИКА БЪЛГАРИЯ</h1>
            </div>
            
            <div id="treasury-overlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 100; padding: 25px; border: 2px solid #7b1a1a; box-sizing: border-box;">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; padding-bottom: 15px;">
                    <h2 style="font-family: 'Cinzel'; color: #d4af37; font-size: 20px; margin:0; letter-spacing: 2px;">🏺 РОДОВА СЪКРОВИЩНИЦА</h2>
                    <button onclick="window.toggleTreasury()" style="background:none; border:none; color:#d4af37; font-size:28px; cursor:pointer;">✕</button>
                </div>
                <div id="treasury-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; margin-top: 25px;"></div>
            </div>
        </section>

        <aside id="right-sidebar" style="width: 280px; background: #0a0a0a; border-left: 1px solid #333;">
            <div style="padding: 10px; background: #111; border-bottom: 1px solid #333; font-family: 'Cinzel'; font-size: 11px; color: #d4af37; text-align: center;">
                ВЕСТИ И СЪБИТИЯ
            </div>
            <div id="events-center" style="padding: 10px; overflow-y: auto; height: calc(100% - 40px);"></div>
        </aside>
    </main>

    <footer id="bottom-controls" style="background: #111; height: 50px; border-top: 2px solid #d4af37; display: flex; justify-content: center; gap: 20px; align-items: center;">
       <button class="action-btn" onclick="window.advanceTurn()">⏳ СЛЕДВАЩ ХОД</button>
    <button class="action-btn" onclick="window.startBattle()">⚔️ БИТКА</button>
    <button class="action-btn" onclick="window.openMarriageMenu()">💍 БРАК</button>
    <button class="action-btn" onclick="window.buyUnits()">🛡️ ОБУЧЕНИЕ</button>
    </footer>

    <script src="database.js"></script>
    <script src="mechanics.js"></script>
    <script src="time.js"></script>
    <script src="world_data.js"></script>
    <script src="economy.js"></script>
    <script src="barracks.js"></script>
    <script src="battle.js"></script>
    <script src="regions.js"></script>
    <script src="diplomacy.js"></script>
    <script src="events.js"></script>
    <script src="items.js"></script>
    <script src="logic.js"></script>
    <script src="ui.js"></script>
    <script src="suggestions.js"></script>
</body>
</html>
